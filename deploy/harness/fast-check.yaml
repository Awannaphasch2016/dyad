pipeline:
  name: Dyad fast-check
  identifier: dyad_fast_check
  orgIdentifier: default
  projectIdentifier: dyad
  description: Experiment 2. Same commands as GitHub Actions fast-check. GitHub Actions stays the required check.
  properties:
    ci:
      codebase:
        connectorRef: account.Dyad
        repoName: Awannaphasch2016/dyad
        build:
          type: branch
          spec:
            branch: cursor/harness-equivalence-5527
  stages:
    - stage:
        name: fast-check
        identifier: fast_check
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Check changed files
                  identifier: check_changes
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail
                      should_run_tests=true
                      should_run_schema_diff_tests=false
                      should_run_schema_classifier_tests=false
                      if git fetch --depth=1 origin main; then
                        changed="$(git diff --name-only FETCH_HEAD HEAD || true)"
                      else
                        changed=""
                        echo "could not determine changed files"
                      fi
                      if [ -n "${changed}" ]; then
                        echo "changed_count=$(printf '%s\n' "${changed}" | grep -c . || true)"
                        if printf '%s\n' "${changed}" | grep -q "^packages/ts-pg-schema-diff/"; then
                          should_run_schema_diff_tests=true
                        fi
                        if printf '%s\n' "${changed}" | grep -q "^packages/pg-schema-classifier/"; then
                          should_run_schema_classifier_tests=true
                        fi
                        non_config="$(printf '%s\n' "${changed}" | grep -v "^\.claude/" | grep -v "^rules/" || true)"
                        if [ -z "${non_config}" ]; then
                          should_run_tests=false
                        fi
                      fi
                      export should_run_tests should_run_schema_diff_tests should_run_schema_classifier_tests
                      echo "decision tests=${should_run_tests} schema_diff=${should_run_schema_diff_tests} schema_classifier=${should_run_schema_classifier_tests}"
                    outputVariables:
                      - name: should_run_tests
                      - name: should_run_schema_diff_tests
                      - name: should_run_schema_classifier_tests
              - step:
                  type: Run
                  name: Install Node 24.13.1
                  identifier: install_node
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail
                      prefix="${HOME}/.local/node"
                      mkdir -p "${prefix}"
                      NODE_VERSION=24.13.1
                      curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
                      tar -xJf /tmp/node.tar.xz -C "${prefix}" --strip-components=1
                      export PATH="${prefix}/bin:${PATH}"
                      hash -r
                      echo "node=$(node -v)"
                      test "$(node -v)" = "v${NODE_VERSION}"
              - step:
                  type: Run
                  name: Install npm 11.8.0
                  identifier: install_npm
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail
                      export PATH="${HOME}/.local/node/bin:${PATH}"
                      hash -r
                      npm install -g npm@11.8.0
                      hash -r
                      version="$(npm -v | tr -d '[:space:]')"
                      echo "npm_version=${version}"
                      test "${version}" = "11.8.0"
              - step:
                  type: Run
                  name: Install node modules
                  identifier: install_node_modules
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail
                      export PATH="${HOME}/.local/node/bin:${PATH}"
                      bash scripts/npm-ci-retry.sh
              - step:
                  type: Run
                  name: Prep test server
                  identifier: prep_test_server
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail
                      export PATH="${HOME}/.local/node/bin:${PATH}"
                      cd testing/fake-llm-server && npm install && npm run build && cd -
              - step:
                  type: Run
                  name: Presubmit check
                  identifier: presubmit
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail
                      export PATH="${HOME}/.local/node/bin:${PATH}"
                      npm run presubmit
              - step:
                  type: Run
                  name: Type-checking
                  identifier: typecheck
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail
                      export PATH="${HOME}/.local/node/bin:${PATH}"
                      npm run ts
              - step:
                  type: Run
                  name: Browser bridge and file sync tests
                  identifier: browser_bridge_and_file_sync
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail
                      export PATH="${HOME}/.local/node/bin:${PATH}"
                      npm test -- src/main/browser_bridge.test.ts src/control_plane/file_sync.test.ts
              - step:
                  type: Run
                  name: Rollout helper tests
                  identifier: rollout_helper_tests
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail
                      export PATH="${HOME}/.local/node/bin:${PATH}"
                      bash scripts/gascity/rollout.test.sh
