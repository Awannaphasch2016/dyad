pipeline:
  name: Dyad fast-check
  identifier: dyad_fast_check
  orgIdentifier: default
  projectIdentifier: dyad
  description: Experiment 2. Same commands as GitHub Actions fast-check. GitHub Actions stays the required check.
  properties:
    ci:
      codebase:
        connectorRef: account.Dyad
        repoName: Awannaphasch2016/dyad
        build:
          type: branch
          spec:
            branch: cursor/harness-equivalence-5527
  stages:
    - stage:
        name: fast-check
        identifier: fast_check
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Node 24.13.1
                  identifier: install_node
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail
                      NODE_VERSION=24.13.1
                      curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
                      sudo tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
                      node -v | grep -qx "v${NODE_VERSION}"
              - step:
                  type: Run
                  name: Install npm 11.8.0
                  identifier: install_npm
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail
                      npm install -g npm@11.8.0
                      npm -v | grep -qx "11.8.0"
              - step:
                  type: Run
                  name: Install node modules
                  identifier: install_node_modules
                  spec:
                    shell: Bash
                    command: bash scripts/npm-ci-retry.sh
              - step:
                  type: Run
                  name: Prep test server
                  identifier: prep_test_server
                  spec:
                    shell: Bash
                    command: cd testing/fake-llm-server && npm install && npm run build && cd -
              - step:
                  type: Run
                  name: Presubmit check
                  identifier: presubmit
                  spec:
                    shell: Bash
                    command: npm run presubmit
              - step:
                  type: Run
                  name: Type-checking
                  identifier: typecheck
                  spec:
                    shell: Bash
                    command: npm run ts
              - step:
                  type: Run
                  name: Browser bridge and file sync tests
                  identifier: browser_bridge_and_file_sync
                  spec:
                    shell: Bash
                    command: npm test -- src/main/browser_bridge.test.ts src/control_plane/file_sync.test.ts
              - step:
                  type: Run
                  name: Rollout helper tests
                  identifier: rollout_helper_tests
                  spec:
                    shell: Bash
                    command: bash scripts/gascity/rollout.test.sh
