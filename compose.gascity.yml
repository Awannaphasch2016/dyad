services:
  weaver-plus:
    build:
      context: .
      dockerfile: Dockerfile.gascity
    image: weaver-plus:gascity
    network_mode: host
    shm_size: 1gb
    environment:
      NOVNC_PORT: "${NOVNC_PORT:-6080}"
      NOVNC_PASSWORD: "${NOVNC_PASSWORD:?Set NOVNC_PASSWORD in the shell}"
      NOVNC_GEOMETRY: "${NOVNC_GEOMETRY:-1600x900}"
      GAS_CITY_HOST_BRIDGE_ENABLED: "${GAS_CITY_HOST_BRIDGE_ENABLED:-true}"
      GAS_CITY_HOST_BRIDGE_PORT: "${GAS_CITY_HOST_BRIDGE_PORT:-32100}"
      GAS_CITY_HOST_BRIDGE_TOKEN: "${GAS_CITY_HOST_BRIDGE_TOKEN:?Set GAS_CITY_HOST_BRIDGE_TOKEN in the shell}"
      # Clerk sign-in and shared accounts. Leave unset for an ungated local app.
      CLERK_PUBLISHABLE_KEY: "${CLERK_PUBLISHABLE_KEY:-}"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY:-}"
      WEWEBPLUS_DATABASE_URL: "${WEWEBPLUS_DATABASE_URL:-}"
      WEWEBPLUS_SECRETS_KEY: "${WEWEBPLUS_SECRETS_KEY:-}"
      # Same renderer on a loopback HTTP port for a tunnel (DYAD_BROWSER_BRIDGE=1).
      DYAD_BROWSER_BRIDGE: "${DYAD_BROWSER_BRIDGE:-0}"
      DYAD_BROWSER_BRIDGE_PORT: "${DYAD_BROWSER_BRIDGE_PORT:-8372}"
      # Singapore Bedrock. IAM keys replace a saved bearer token when both are set.
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_REGION: "${AWS_REGION:-ap-southeast-1}"
    volumes:
      - weaver-plus-user-data:/home/weaver/.config
      - "${WEAVER_PROJECTS_DIR:-weaver-plus-projects}:/home/weaver/dyad-apps"
    restart: unless-stopped

volumes:
  weaver-plus-user-data:
  weaver-plus-projects:
