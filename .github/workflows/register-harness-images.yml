# Create the image pipeline, then update it if it already exists, then start it.
# Digest check: the Dockerfile comment changes the Docker context.
name: Register Harness image pipeline

on:
  push:
    branches:
      - cursor/harness-images-5527
    paths:
      - .github/workflows/register-harness-images.yml
      - deploy/harness/images.yaml

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Create or update the pipeline and start it
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          HARNESS_ACCOUNT: WKxXBnSFTRaOF64-h90PyQ
          DYAD_HARNESS_APP_PEM: ${{ secrets.DYAD_HARNESS_APP_PEM }}
        run: |
          python3 << 'PY'
          import base64, json, os, re, subprocess
          from pathlib import Path

          api_key = os.environ["HARNESS_API_KEY"]
          account = os.environ["HARNESS_ACCOUNT"]
          pipeline = "dyad_harness_images"
          long_token = re.compile(r"[A-Za-z0-9+/=]{40,}")

          def scrub(text):
              return long_token.sub("[redacted]", text or "")

          def request(method, url, yaml_path):
              out = Path("/tmp/harness-image.bin")
              out.unlink(missing_ok=True)
              cmd = [
                  "curl", "-sS", "--max-time", "60", "-o", str(out), "-w", "%{http_code}",
                  "-X", method, url, "-H", f"x-api-key: {api_key}",
                  "-H", "Content-Type: application/yaml", "--data-binary", f"@{yaml_path}",
              ]
              result = subprocess.run(cmd, text=True, capture_output=True)
              if result.returncode != 0:
                  print("CURL_FAILED", scrub(result.stderr)[:200])
                  raise SystemExit(1)
              raw = out.read_text("utf-8", "replace") if out.exists() else ""
              try:
                  parsed = json.loads(raw) if raw else {}
              except json.JSONDecodeError:
                  parsed = {"raw": scrub(raw)[:300]}
              return result.stdout.strip(), parsed

          def request_json(method, url, payload):
              out = Path("/tmp/harness-secret.bin")
              body_path = Path("/tmp/harness-secret.json")
              out.unlink(missing_ok=True)
              body_path.write_text(json.dumps(payload))
              result = subprocess.run(
                  [
                      "curl", "-sS", "--max-time", "60", "-o", str(out), "-w", "%{http_code}",
                      "-X", method, url, "-H", f"x-api-key: {api_key}",
                      "-H", "Content-Type: application/json", "--data-binary", f"@{body_path}",
                  ],
                  text=True,
                  capture_output=True,
              )
              body_path.unlink(missing_ok=True)
              if result.returncode != 0:
                  print("CURL_FAILED", scrub(result.stderr)[:200])
                  raise SystemExit(1)
              raw = out.read_text("utf-8", "replace") if out.exists() else ""
              out.unlink(missing_ok=True)
              try:
                  parsed = json.loads(raw) if raw else {}
              except json.JSONDecodeError:
                  parsed = {"raw": scrub(raw)[:300]}
              return result.stdout.strip(), parsed

          pem = os.environ.get("DYAD_HARNESS_APP_PEM", "")
          if "\\n" in pem and pem.count("\n") < 2:
              pem = pem.replace("\\n", "\n")
          print(
              "pem_has_header",
              "PRIVATE KEY" in pem,
              "pem_len",
              len(pem),
              "pem_lines",
              pem.count("\n"),
          )
          account_query = f"?accountIdentifier={account}"
          meta_out = Path("/tmp/harness-secret-meta.bin")
          meta = subprocess.run(
              [
                  "curl", "-sS", "--max-time", "60", "-o", str(meta_out), "-w", "%{http_code}",
                  "-H", f"x-api-key: {api_key}",
                  "https://app.harness.io/ng/api/v2/secrets/dyad_harness_app_key_pkcs8"
                  + account_query,
              ],
              text=True,
              capture_output=True,
          )
          print("file_secret_http", meta.stdout.strip())
          try:
              meta_body = json.loads(meta_out.read_text("utf-8", "replace"))
          except json.JSONDecodeError:
              meta_body = {}
          meta_out.unlink(missing_ok=True)

          def summarize(value, prefix):
              if isinstance(value, dict):
                  for key, item in value.items():
                      summarize(item, f"{prefix}.{key}")
              elif isinstance(value, list):
                  print(f"field {prefix} list={len(value)}")
              elif isinstance(value, str):
                  print(f"field {prefix} len={len(value)} lines={value.count(chr(10))}")
              else:
                  print(f"field {prefix} type={type(value).__name__}")

          summarize(meta_body, "secret")
          if "PRIVATE KEY" in pem and len(pem) >= 200:
              encoded = base64.b64encode(pem.encode("utf-8")).decode("ascii")
              print("b64_len", len(encoded))
              secret_id = "dyad_harness_app_key_b64"
              secret_payload = {
                  "secret": {
                      "type": "SecretText",
                      "name": "dyad-harness-app-key-b64",
                      "identifier": secret_id,
                      "description": "One-line base64 of the GitHub App key for GHCR login.",
                      "spec": {
                          "secretManagerIdentifier": "harnessSecretManager",
                          "valueType": "Inline",
                          "value": encoded,
                      },
                  }
              }
              code, body = request_json(
                  "POST",
                  f"https://app.harness.io/ng/api/v2/secrets{account_query}",
                  secret_payload,
              )
              message = str(body.get("message") or "")
              print("create_text_secret", code, body.get("status"), scrub(message)[:300])
              if code not in {"200", "201"}:
                  code, body = request_json(
                      "PUT",
                      f"https://app.harness.io/ng/api/v2/secrets/{secret_id}{account_query}",
                      secret_payload,
                  )
                  print("update_text_secret", code, body.get("status"), scrub(str(body.get("message") or ""))[:300])
                  if code not in {"200", "201"}:
                      raise SystemExit(1)

          query = f"?accountIdentifier={account}&orgIdentifier=default&projectIdentifier=dyad"
          code, body = request(
              "POST",
              f"https://app.harness.io/pipeline/api/pipelines/v2{query}",
              "deploy/harness/images.yaml",
          )
          message = str(body.get("message") or "")
          print("create_pipeline", code, body.get("status"), scrub(message)[:300])
          if code not in {"200", "201"} and "exist" not in message.lower():
              raise SystemExit(1)
          if code not in {"200", "201"}:
              code, body = request(
                  "PUT",
                  f"https://app.harness.io/pipeline/api/pipelines/v2/{pipeline}{query}",
                  "deploy/harness/images.yaml",
              )
              print("update_pipeline", code, body.get("status"), scrub(str(body.get("message") or ""))[:300])
              if code not in {"200", "201"}:
                  raise SystemExit(1)

          execute_body = Path("/tmp/harness-image-execute.yaml")
          execute_body.write_text(
              "pipeline:\n"
              f"  identifier: {pipeline}\n"
              "  properties:\n"
              "    ci:\n"
              "      codebase:\n"
              "        build:\n"
              "          type: branch\n"
              "          spec:\n"
              "            branch: cursor/harness-images-5527\n"
          )
          code, body = request(
              "POST",
              "https://app.harness.io/pipeline/api/pipeline/execute/"
              f"{pipeline}{query}&moduleType=CI",
              execute_body,
          )
          print("execute", code, body.get("status"), scrub(str(body.get("message") or ""))[:400])
          data = body.get("data") if isinstance(body.get("data"), dict) else {}
          plan = data.get("planExecution") if isinstance(data.get("planExecution"), dict) else {}
          execution = (
              data.get("planExecutionId")
              or data.get("uuid")
              or plan.get("uuid")
              or plan.get("planExecutionId")
              or ""
          )
          print("execution", execution)
          if code not in {"200", "201"}:
              raise SystemExit(1)
          PY
