# Compare Cloudflare credential fingerprints. Does not print secret values.
name: Compare Cloudflare credentials

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/cf-token-compare-55d6
    paths:
      - .github/workflows/compare-cloudflare-credentials.yml
      - deploy/preview/compare_cloudflare_credentials.mjs

permissions:
  contents: read
  id-token: write

jobs:
  compare-doppler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compare Doppler Cloudflare credentials
        env:
          DOPPLER_ADMIN_TOKEN: ${{ secrets.DOPPLER_ADMIN_TOKEN }}
          GITHUB_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node deploy/preview/compare_cloudflare_credentials.mjs

  compare-devbox-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Log in to Namespace with the GitHub token
        uses: namespacelabs/nscloud-setup@v0

      - name: Install the Devbox CLI
        run: |
          set -euo pipefail
          ver=0.0.195
          curl -fsSL "https://get.namespace.so/packages/devbox/v${ver}/devbox_${ver}_linux_amd64.tar.gz" -o /tmp/devbox.tgz
          mkdir -p /tmp/devbox-extract
          tar -xzf /tmp/devbox.tgz -C /tmp/devbox-extract
          bin="$(find /tmp/devbox-extract -type f -name devbox -print -quit)"
          test -n "$bin"
          sudo install -m 755 "$bin" /usr/local/bin/devbox

      - name: Point the Devbox CLI at the federated token
        run: |
          set -euo pipefail
          token_file=""
          if [[ -f /var/run/nsc/token.json ]]; then
            token_file=/var/run/nsc/token.json
          elif [[ -f "${HOME}/.config/ns/token.json" ]]; then
            token_file="${HOME}/.config/ns/token.json"
          else
            echo "Namespace login did not write a token file" >&2
            exit 1
          fi
          echo "NSC_TOKEN_FILE=${token_file}" >> "$GITHUB_ENV"

      - name: Fingerprint saved tunnel tokens and test one connector
        run: |
          set -euo pipefail
          payload="$(base64 -w0 <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, glob, urllib.request, urllib.error
          root = os.path.expanduser("~/.local/state/wewebplus-preview")
          print("state_dir", "present" if os.path.isdir(root) else "absent")
          found = []
          if os.path.isdir(root):
              for path in sorted(glob.glob(os.path.join(root, "*"))):
                  if not os.path.isfile(path):
                      continue
                  name = os.path.basename(path)
                  try:
                      text = open(path, encoding="utf-8", errors="replace").read()
                  except OSError:
                      print(f"{name} unreadable")
                      continue
                  for line in text.splitlines():
                      if not line or line.startswith("#") or "=" not in line:
                          continue
                      key, value = line.split("=", 1)
                      if key.startswith("export "):
                          key = key[len("export "):]
                      if "CLOUDFLARE" not in key and "TUNNEL" not in key:
                          continue
                      value = value.strip().strip("'\"").strip()
                      if not value:
                          print(f"file {name} {key} absent")
                          continue
                      digest = hashlib.sha256(value.encode()).hexdigest()[:12]
                      kind = "eyJ" if value.startswith("eyJ") else "other"
                      print(f"file {name} {key} length={len(value)} sha256_12={digest} class={kind}")
                      if key == "CLOUDFLARE_TUNNEL_TOKEN":
                          found.append((name, value, digest))
                      value = ""
          seen = set()
          for name, value, digest in found:
              if digest in seen:
                  continue
              seen.add(digest)
              request = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4/user/tokens/verify",
                  headers={"Authorization": f"Bearer {value}"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      print(f"probe file {name} tunnel {digest} verify={response.status}")
              except urllib.error.HTTPError as error:
                  message = "unparsed"
                  try:
                      body = json.loads(error.read().decode())
                      errors = body.get("errors") or []
                      message = "; ".join(
                          f"{item.get('code', '?')}:{item.get('message', '')}" for item in errors
                      ) or "none"
                  except Exception:
                      message = "unparsed"
                  print(f"probe file {name} tunnel {digest} verify={error.code} error={message}")
              value = ""
          print(f"tunnel_files={len(found)} unique={len(seen)}")
          PY
          if ! command -v docker >/dev/null 2>&1; then
            echo "docker absent"
            exit 0
          fi
          python3 - <<'PY'
          import hashlib, os, glob, subprocess, time
          root = os.path.expanduser("~/.local/state/wewebplus-preview")
          token = ""
          digest = ""
          if os.path.isdir(root):
              for path in sorted(glob.glob(os.path.join(root, "*"))):
                  if not os.path.isfile(path):
                      continue
                  text = open(path, encoding="utf-8", errors="replace").read()
                  for line in text.splitlines():
                      if "CLOUDFLARE_TUNNEL_TOKEN=" not in line:
                          continue
                      value = line.split("=", 1)[1].strip().strip("'\"")
                      if value:
                          token = value
                          digest = hashlib.sha256(value.encode()).hexdigest()[:12]
                          break
                  if token:
                      break
          if not token:
              print("connector skipped tunnel_token=absent")
              raise SystemExit(0)
          print(f"connector start sha256_12={digest}")
          subprocess.run(["docker", "rm", "-f", "dyad-tunnel-probe"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          env = os.environ.copy()
          env["TUNNEL_TOKEN"] = token
          token = ""
          started = subprocess.run(
              [
                  "docker", "run", "-d", "--name", "dyad-tunnel-probe",
                  "-e", "TUNNEL_TOKEN",
                  "cloudflare/cloudflared:2026.9.3",
                  "tunnel", "--no-autoupdate", "run",
              ],
              env=env,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.PIPE,
              text=True,
          )
          env["TUNNEL_TOKEN"] = ""
          if started.returncode != 0:
              print("connector result start-failed")
              raise SystemExit(0)
          matched = "timeout"
          deadline = time.time() + 60
          while time.time() < deadline:
              logs = subprocess.run(
                  ["docker", "logs", "dyad-tunnel-probe"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              lower = (logs.stdout or "").lower()
              if "registered tunnel connection" in lower:
                  matched = "registered"
                  break
              if "unauthorized" in lower or "invalid tunnel" in lower or "failed to parse" in lower:
                  matched = "rejected"
                  break
              time.sleep(2)
          subprocess.run(["docker", "rm", "-f", "dyad-tunnel-probe"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          print(f"connector result sha256_12={digest} {matched}")
          PY
          REMOTE
          )"
          devbox exec Wewebplus-ci -- bash -lc "printf '%s' '${payload}' | base64 -d | bash"
