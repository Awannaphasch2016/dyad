name: Read Harness fast-check result

on:
  push:
    branches:
      - cursor/harness-equivalence-5527
    paths:
      - .github/workflows/read-harness-fast-check.yml

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read timings and one step log
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          HARNESS_ACCOUNT: WKxXBnSFTRaOF64-h90PyQ
        run: |
          python3 << 'PY'
          import json, os, re, subprocess, time, zipfile
          from pathlib import Path

          api_key = os.environ["HARNESS_API_KEY"]
          account = os.environ["HARNESS_ACCOUNT"]
          org = "default"
          project = "dyad"
          pipeline = "dyad_fast_check"
          plans = ["nI911DyPQC2Gd1sIV6yQOw", "AZ8LJ5CLQSGY0QCbWG69_g"]
          pem = re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----.*?-----END [A-Z ]*PRIVATE KEY-----", re.S)
          long_token = re.compile(r"[A-Za-z0-9+/=]{40,}")
          database_url = re.compile(r"postgres(?:ql)?://\S+", re.I)
          signed_url = re.compile(r"https?://\S*(?:signature|token|X-Goog|X-Amz|Expires)\S*", re.I)

          def scrub(text):
              text = pem.sub("[redacted-pem]", text or "")
              text = database_url.sub("[redacted-db]", text)
              text = signed_url.sub("[redacted-url]", text)
              return long_token.sub("[redacted]", text)

          def request(method, url, payload=None):
              out = Path("/tmp/harness-read.bin")
              out.unlink(missing_ok=True)
              cmd = [
                  "curl", "-sS", "--max-time", "60", "-o", str(out), "-w", "%{http_code}",
                  "-X", method, url,
                  "-H", f"x-api-key: {api_key}",
                  "-H", "Content-Type: application/json",
              ]
              if payload is not None:
                  body = Path("/tmp/harness-read.json")
                  body.write_text(json.dumps(payload))
                  cmd += ["--data-binary", f"@{body}"]
              result = subprocess.run(cmd, text=True, capture_output=True)
              if result.returncode != 0:
                  print("CURL_FAILED", scrub(result.stderr)[:200])
                  return "0", {}, b""
              raw = out.read_bytes() if out.exists() else b""
              try:
                  parsed = json.loads(raw.decode("utf-8", "replace")) if raw else {}
              except json.JSONDecodeError:
                  parsed = {}
              return result.stdout.strip(), parsed, raw

          url = (
              "https://app.harness.io/pipeline/api/pipelines/execution/summary"
              f"?accountIdentifier={account}&orgIdentifier={org}"
              f"&projectIdentifier={project}&pipelineIdentifier={pipeline}&page=0&size=5"
          )
          code, body, _raw = request("POST", url, {"filterType": "PipelineExecution"})
          print("summary_http", code)
          rows = ((body.get("data") or {}).get("content") or []) if isinstance(body.get("data"), dict) else []
          by_id = {row.get("planExecutionId"): row for row in rows}
          for plan in plans:
              row = by_id.get(plan) or {}
              trigger = row.get("executionTriggerInfo") or {}
              who = trigger.get("triggeredBy") or {}
              print(json.dumps({
                  "execution": plan,
                  "status": row.get("status"),
                  "run_sequence": row.get("runSequence"),
                  "start_ts": row.get("startTs"),
                  "end_ts": row.get("endTs"),
                  "trigger_type": trigger.get("triggerType"),
                  "triggered_by_identifier_present": bool(who.get("identifier") or who.get("uuid")),
              }))

          def node_hints(plan):
              detail_url = (
                  "https://app.harness.io/pipeline/api/pipelines/execution/v2/"
                  f"{plan}?accountIdentifier={account}&orgIdentifier={org}"
                  f"&projectIdentifier={project}&renderFullBottomGraph=true"
              )
              code, detail, _raw = request("GET", detail_url)
              print("detail_http", plan, code)
              data = detail.get("data") if isinstance(detail.get("data"), dict) else {}
              graph = data.get("executionGraph") or {}
              nodes = graph.get("nodeMap") or {}
              for node in nodes.values():
                  if not isinstance(node, dict):
                      continue
                  if node.get("identifier") != "install_npm" and node.get("name") != "Install npm 11.8.0":
                      continue
                  print("npm_node_keys", ",".join(sorted(node.keys())))
                  for key, value in node.items():
                      if not isinstance(value, str):
                          continue
                      lowered = key.lower()
                      if "log" in lowered or "fqn" in lowered or "key" in lowered or "/" in value:
                          print("npm_field", key, scrub(value)[:180])
              return data

          def print_log(raw):
              path = Path("/tmp/harness-log.bin")
              path.write_bytes(raw)
              lines = []
              if raw[:2] == b"PK":
                  with zipfile.ZipFile(path) as archive:
                      names = archive.namelist()
                      print("zip_entries", len(names))
                      for name in names[:8]:
                          print("zip_name", name[:120])
                          text = archive.read(name).decode("utf-8", "replace")
                          for line in text.splitlines():
                              try:
                                  parsed = json.loads(line)
                              except json.JSONDecodeError:
                                  parsed = None
                              piece = line
                              if isinstance(parsed, dict):
                                  piece = parsed.get("out") or parsed.get("message") or parsed.get("logLine") or ""
                              if piece:
                                  lines.append(scrub(str(piece)))
              else:
                  print("log_not_zip", scrub(raw[:180].decode("utf-8", "replace")))
                  return
              interesting = [
                  line for line in lines
                  if re.search(r"npm_version|node=|ERR!|error|exit|presubmit|11\.8\.0", line, re.I)
              ]
              print("log_lines", len(lines), "interesting", len(interesting))
              for line in (interesting or lines)[:30]:
                  print("log", line[:240])

          def poll_log(prefix):
              download = (
                  "https://app.harness.io/gateway/log-service/blob/download"
                  f"?accountID={account}&prefix={prefix}"
              )
              for attempt in range(8):
                  code, parsed, raw = request("POST", download, {})
                  status = parsed.get("status") if isinstance(parsed, dict) else ""
                  print("log_poll", attempt, "http", code, "status", status, "tail", prefix.split("/")[-1])
                  if status == "success" and parsed.get("link"):
                      fetched = Path("/tmp/harness-log-link.bin")
                      result = subprocess.run(
                          ["curl", "-sS", "--max-time", "60", "-L", "-o", str(fetched), "-w", "%{http_code}", parsed["link"]],
                          text=True, capture_output=True,
                      )
                      print("log_link_http", result.stdout.strip(), "bytes", fetched.stat().st_size if fetched.exists() else 0)
                      if fetched.exists() and fetched.stat().st_size > 100:
                          print_log(fetched.read_bytes())
                      return
                  if code != "200":
                      message = parsed.get("message") if isinstance(parsed, dict) else ""
                      print("log_error", scrub(str(message))[:200])
                      return
                  time.sleep(5)

          for plan in plans:
              node_hints(plan)
          for plan, sequence, step in (
              ("nI911DyPQC2Gd1sIV6yQOw", 1, "install_npm"),
              ("AZ8LJ5CLQSGY0QCbWG69_g", 2, "install_npm"),
              ("AZ8LJ5CLQSGY0QCbWG69_g", 2, "presubmit"),
          ):
              poll_log(f"{account}/pipeline/{pipeline}/{sequence}/-{plan}/fast_check/{step}")
          poll_log(f"{account}/pipeline/{pipeline}/2/-AZ8LJ5CLQSGY0QCbWG69_g")
          PY
