name: Store Harness key in Doppler temporarily

on:
  push:
    branches:
      - cursor/harness-equivalence-5527
    paths:
      - .github/workflows/doppler-harness-key-tmp.yml

permissions:
  contents: read

jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - name: Replace the temporary Doppler copy with the new key
        env:
          DYAD_HARNESS_APP_PEM: ${{ secrets.DYAD_HARNESS_APP_PEM }}
          DOPPLER_ADMIN_TOKEN: ${{ secrets.DOPPLER_ADMIN_TOKEN }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          HARNESS_ACCOUNT: WKxXBnSFTRaOF64-h90PyQ
        run: |
          python3 << 'PY'
          import json, os, re, subprocess, urllib.parse
          from pathlib import Path

          pem = os.environ.get("DYAD_HARNESS_APP_PEM") or ""
          token = os.environ.get("DOPPLER_ADMIN_TOKEN") or ""
          harness_key = os.environ.get("HARNESS_API_KEY") or ""
          account = os.environ.get("HARNESS_ACCOUNT") or ""
          original = Path("/tmp/original.pem")
          converted = Path("/tmp/converted.pem")
          project = "dyad"
          config = "harness-tmp"
          secret_name = "DYAD_HARNESS_APP_KEY_PKCS8"

          def scrub(text):
              text = re.sub(
                  r"-----BEGIN [A-Z0-9 ]+-----[\s\S]*?-----END [A-Z0-9 ]+-----",
                  "[pem]",
                  text,
              )
              text = re.sub(r"[A-Za-z0-9+/=]{40,}", "[blob]", text)
              text = re.sub(r"dp\.(ct|st|pt|sa)\.[A-Za-z0-9]+", "[token]", text)
              return text

          def fail(message):
              print(scrub(message))
              raise SystemExit(1)

          if not pem.strip():
              fail("PEM_ABSENT")
          if not token.strip():
              fail("DOPPLER_ADMIN_TOKEN_ABSENT")

          normalized = pem.replace("\r\n", "\n").replace("\r", "\n").strip("\n") + "\n"
          original.write_bytes(normalized.encode())
          original.chmod(0o600)
          print("original_lines", normalized.count("\n"))
          print("original_cr", pem.count("\r"))
          print("has_begin_rsa", "-----BEGIN RSA PRIVATE KEY-----" in normalized)
          print(
              "ends_on_end_line",
              normalized.rstrip("\n").endswith("-----END RSA PRIVATE KEY-----"),
          )
          if "-----BEGIN RSA PRIVATE KEY-----" not in normalized:
              fail("PEM_MISSING_BEGIN")
          if not normalized.rstrip("\n").endswith("-----END RSA PRIVATE KEY-----"):
              fail("PEM_MISSING_END")

          convert = subprocess.run(
              [
                  "openssl", "pkcs8", "-topk8", "-inform", "PEM", "-outform", "PEM",
                  "-in", str(original), "-out", str(converted), "-nocrypt",
              ],
              text=True, capture_output=True,
          )
          if convert.returncode != 0:
              fail("OPENSSL_CONVERT_FAILED " + scrub(convert.stderr))
          check = subprocess.run(
              ["openssl", "pkey", "-in", str(converted), "-noout"],
              text=True, capture_output=True,
          )
          if check.returncode != 0:
              fail("OPENSSL_CHECK_FAILED " + scrub(check.stderr))
          converted_text = converted.read_text()
          print("converted_begin", converted_text.splitlines()[0])
          last = [line for line in converted_text.splitlines() if line]
          print("converted_end", last[-1])

          def request(method, url, payload=None, headers=None):
              out = Path("/tmp/api-response.json")
              if out.exists():
                  out.unlink()
              cmd = [
                  "curl", "-sS", "-o", str(out), "-w", "%{http_code}",
                  "-X", method, url,
              ]
              for header in headers or []:
                  cmd += ["-H", header]
              if payload is not None:
                  body = Path("/tmp/api-request.json")
                  body.write_text(json.dumps(payload))
                  body.chmod(0o600)
                  cmd += ["-H", "Content-Type: application/json", "--data-binary", f"@{body}"]
              result = subprocess.run(cmd, text=True, capture_output=True)
              if result.returncode != 0:
                  fail("CURL_FAILED " + scrub(result.stderr))
              raw = out.read_text() if out.exists() else ""
              out.unlink(missing_ok=True)
              try:
                  parsed = json.loads(raw) if raw else {}
              except json.JSONDecodeError:
                  fail("NON_JSON " + scrub(raw)[:300])
              return result.stdout.strip(), parsed

          code, saved = request(
              "POST",
              "https://api.doppler.com/v3/configs/config/secrets",
              {
                  "project": project,
                  "config": config,
                  "secrets": {secret_name: converted_text},
              },
              [
                  f"Authorization: Bearer {token}",
                  "Accept: application/json",
              ],
          )
          print("secret_http", code)
          print("secret_success", saved.get("success"))
          if saved.get("messages"):
              print("secret_messages", scrub(json.dumps(saved.get("messages")))[:300])
          if code not in {"200", "201"} or saved.get("success") is False:
              fail("SECRET_WRITE_FAILED")

          code, names = request(
              "GET",
              "https://api.doppler.com/v3/configs/config/secrets/names"
              f"?project={project}&config={config}",
              headers=[
                  f"Authorization: Bearer {token}",
                  "Accept: application/json",
              ],
          )
          print("names_http", code)
          name_list = names.get("names") or []
          print("has_target_secret", secret_name in name_list)
          if secret_name not in name_list:
              fail("SECRET_NOT_LISTED")
          print(f"DOPPLER_READY project={project} config={config} secret={secret_name}")

          if harness_key.strip():
              spec = {
                  "secret": {
                      "type": "SecretFile",
                      "name": "dyad-harness-app-key-pkcs8",
                      "identifier": "dyad_harness_app_key_pkcs8",
                      "description": "GitHub App dyad-harness private key, PKCS8",
                      "spec": {"secretManagerIdentifier": "harnessSecretManager"},
                  }
              }
              spec_path = Path("/tmp/secret-spec.json")
              spec_path.write_text(json.dumps(spec))
              query = urllib.parse.urlencode({"accountIdentifier": account})
              update_url = (
                  "https://app.harness.io/ng/api/v2/secrets/files/"
                  f"dyad_harness_app_key_pkcs8?{query}"
              )
              out = Path("/tmp/harness-response.json")
              result = subprocess.run(
                  [
                      "curl", "-sS", "-o", str(out), "-w", "%{http_code}",
                      "-X", "PUT", update_url,
                      "-H", f"x-api-key: {harness_key}",
                      "-F", f"spec=<{spec_path};type=application/json",
                      "-F", f"file=@{converted};type=application/x-pem-file",
                  ],
                  text=True, capture_output=True,
              )
              print("harness_update_http", result.stdout.strip() if result.returncode == 0 else "curl_failed")
              if result.returncode == 0 and out.exists():
                  try:
                      body = json.loads(out.read_text())
                  except json.JSONDecodeError:
                      body = {}
                  secret = (body.get("data") or {}).get("secret") or {}
                  print(json.dumps({
                      "status": body.get("status"),
                      "code": body.get("code"),
                      "message": scrub(str(body.get("message") or ""))[:300],
                      "secret_identifier": secret.get("identifier"),
                  }))
              out.unlink(missing_ok=True)

          original.unlink(missing_ok=True)
          converted.unlink(missing_ok=True)
          PY
