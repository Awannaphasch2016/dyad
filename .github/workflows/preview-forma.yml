name: preview-forma

# Deploy one Forma commit to the Vercel preview. The workflow lives in this
# repository. A label on Awannaphasch2016/forma does not start it.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full Forma commit SHA. Must match the pull request head when both are set.
        required: false
      pr:
        description: Forma pull request number
        required: false
      environment:
        description: Environment name. Only preview is implemented.
        required: false
        default: preview
  repository_dispatch:
    types: [preview-forma]

permissions:
  contents: read

concurrency:
  group: preview-forma
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    environment: ai-bots
    timeout-minutes: 45
    steps:
      - name: Check out the preview runner
        uses: actions/checkout@v5

      - name: Create a Forma app token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DYAD_GITHUB_APP_ID || '5221649' }}
          private-key: ${{ secrets.DYAD_GITHUB_APP_PEM_KEY }}
          owner: Awannaphasch2016
          repositories: forma
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install pnpm
        run: |
          set -euo pipefail
          set +x
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Deploy the Forma preview
        env:
          DOPPLER_ADMIN_TOKEN: ${{ secrets.DOPPLER_ADMIN_TOKEN }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          FORMA_PR: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.pr || inputs.pr }}
          FORMA_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || inputs.sha }}
          FORMA_ENVIRONMENT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.environment || inputs.environment || 'preview' }}
        run: |
          set -euo pipefail
          set +x
          node scripts/gascity/forma-preview.mjs
