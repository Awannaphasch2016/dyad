name: preview-forma

# A pull request in this repository pins published images in
# deploy/preview-forma/compose.yml. The preview-forma label runs this
# workflow. Builder repositories only publish images. This job pulls those
# pins. It does not build them and it does not upload source to Vercel.
#
# PREVIEW_FORMA_DOCKER_HOST is unset, so the job stops before Doppler, Neon,
# and Docker. The Dyad preview host and the production host are refused.

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number in this repository
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-forma-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  decide:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      command: ${{ steps.decide.outputs.command }}
      pr: ${{ steps.decide.outputs.pr }}
    steps:
      - name: Check out the orchestrator
        uses: actions/checkout@v5

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          CLOSED: ${{ github.event.pull_request.state == 'closed' }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: node deploy/preview-forma/run.mjs decide

  check:
    needs: decide
    if: needs.decide.outputs.command == 'update'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ai-bots
    steps:
      - name: Check out the labeled commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Create a package-read token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DYAD_GITHUB_APP_ID || '5221649' }}
          private-key: ${{ secrets.DYAD_GITHUB_APP_PEM_KEY }}
          owner: Awannaphasch2016
          repositories: forma,bolt.diy,vibesdk
          permission-packages: read

      - name: Check the pinned images
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PREVIEW_FORMA_DOCKER_HOST: ${{ vars.PREVIEW_FORMA_DOCKER_HOST }}
          COMPOSE: deploy/preview-forma/compose.yml
        run: node deploy/preview-forma/run.mjs check

  down:
    needs: decide
    if: needs.decide.outputs.command == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the orchestrator
        uses: actions/checkout@v5

      - name: Skip cleanup until a runner exists
        env:
          PR: ${{ needs.decide.outputs.pr }}
          PREVIEW_FORMA_DOCKER_HOST: ${{ vars.PREVIEW_FORMA_DOCKER_HOST }}
        run: node deploy/preview-forma/run.mjs down
