# Start the published preview 48 image on the shared Devbox.
#
# This job does not build an image, does not SSH, and does not read the
# production deploy key. It starts preview 48 from the published image
# 758c9816, which keeps the browser bridge socket alive with a heartbeat.
# The labeled deploy stopped before DNS existed because
# NEON_PARENT_BRANCH_ID is still the unsanitized Dev branch.
# The project is already at its root branch limit. This job reuses the
# existing schema-only preview branch so Dev rows are not copied. The
# connection URI is masked and is not printed.
# Running preview containers are stopped without deleting volumes so the
# chat database stays and the box has memory for the new image.
# Wake preview 48 after the public address returned HTTP 530.
# The production host is not a target.
name: Preview exec

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/preview-48-resume-55d6
    paths:
      - .github/workflows/preview-exec.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: preview-devbox-wewebplus-ci
  cancel-in-progress: false

jobs:
  exec:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Log in to Namespace with the GitHub token
        uses: namespacelabs/nscloud-setup@v0

      - name: Install the Devbox CLI
        run: |
          set -euo pipefail
          ver=0.0.195
          curl -fsSL "https://get.namespace.so/packages/devbox/v${ver}/devbox_${ver}_linux_amd64.tar.gz" -o /tmp/devbox.tgz
          mkdir -p /tmp/devbox-extract
          tar -xzf /tmp/devbox.tgz -C /tmp/devbox-extract
          bin="$(find /tmp/devbox-extract -type f -name devbox -print -quit)"
          test -n "$bin"
          sudo install -m 755 "$bin" /usr/local/bin/devbox
          devbox version

      - name: Point the Devbox CLI at the federated token
        run: |
          set -euo pipefail
          token_file=""
          if [[ -f /var/run/nsc/token.json ]]; then
            token_file=/var/run/nsc/token.json
          elif [[ -f "${HOME}/.config/ns/token.json" ]]; then
            token_file="${HOME}/.config/ns/token.json"
          else
            echo "Namespace login did not write a token file" >&2
            exit 1
          fi
          echo "NSC_TOKEN_FILE=${token_file}" >> "$GITHUB_ENV"
          python3 - "$token_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          names = sorted(payload)
          if not names:
              raise SystemExit("token file has no fields")
          print("token fields:", ",".join(names))
          PY

      - name: Run one command on Wewebplus-ci
        run: |
          set -euo pipefail
          devbox exec Wewebplus-ci -- echo federated-ok

      - name: Fetch dyad preview secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          doppler-project: dyad
          doppler-config: preview
          inject-env-vars: true

      - name: Fetch aws dev secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          doppler-project: aws
          doppler-config: dev
          inject-env-vars: true

      - name: Require named tunnel credentials
        run: |
          set -euo pipefail
          token="${CLOUDFLARE_API_TOKEN_:-${CLOUDFLARE_API_TOKEN:-}}"
          zone="${CLOUDFLARE_ZONE_ID_:-${CLOUDFLARE_ZONE_ID:-}}"
          account="${CLOUDFLARE_ACCOUNT_ID:-${CLOUDFLARE_ACCOUNT_ID_:-}}"
          if [[ -n "$token" ]]; then echo "CLOUDFLARE_API_TOKEN_: present"; else echo "CLOUDFLARE_API_TOKEN_: absent"; fi
          if [[ -n "$zone" ]]; then echo "CLOUDFLARE_ZONE_ID_: present"; else echo "CLOUDFLARE_ZONE_ID_: absent"; fi
          if [[ -n "$account" ]]; then echo "CLOUDFLARE_ACCOUNT_ID: present"; else echo "CLOUDFLARE_ACCOUNT_ID: absent"; fi
          [[ -n "$token" && -n "$zone" && -n "$account" ]]

      - name: Start preview 48 on Wewebplus-ci
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shlex
          import urllib.error
          import urllib.parse
          import urllib.request

          api_key = os.environ.get("NEON_API_KEY", "")
          if not api_key:
              raise SystemExit("NEON_API_KEY is missing")
          project = "mute-credit-71067312"

          def neon(path, method="GET", body=None):
              payload = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(
                  "https://console.neon.tech/api/v2" + path,
                  data=payload,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", "replace")
                  detail = detail.replace("postgres://", "postgresql://redacted")
                  raise SystemExit(
                      f"Neon {method} {path.split('?', 1)[0]} {error.code} {detail[:240]}"
                  ) from None

          listed = neon(f"/projects/{project}/branches")
          branches = listed.get("branches") or []
          print(f"neon branches: {len(branches)}")
          for branch in branches:
              print(f"branch {branch.get('name', '')} {branch.get('id', '')}")
          # A new branch is refused: this project is already at its root
          # branch limit. Reuse the schema-only preview branch that is
          # already there. Do not copy Dev rows and do not delete a branch.
          by_name = {branch.get("name"): branch for branch in branches}
          chosen = None
          for name in ("preview-pr-48", "preview-pr-46", "preview-pr-44"):
              candidate = by_name.get(name)
              if candidate and candidate.get("id"):
                  chosen = candidate
                  break
          if not chosen:
              raise SystemExit("no existing preview branch to attach")
          print(f"using {chosen.get('name', '')} {chosen.get('id', '')}")
          query = urllib.parse.urlencode(
              {
                  "branch_id": chosen["id"],
                  "database_name": "neondb",
                  "role_name": "neondb_owner",
                  "pooled": "true",
              }
          )
          connection = neon(f"/projects/{project}/connection_uri?{query}")
          uri = connection.get("uri") or ""
          if not uri.startswith("postgres"):
              raise SystemExit("Neon did not return a connection URI")
          print(f"::add-mask::{uri}")
          parsed = urllib.parse.urlparse(uri)
          if parsed.password:
              print(f"::add-mask::{parsed.password}")
              print(f"::add-mask::{urllib.parse.unquote(parsed.password)}")
          os.environ["WEWEBPLUS_DATABASE_URL"] = uri
          print("preview-pr-48 connection uri: present")

          aliases = {
              "CLOUDFLARE_API_TOKEN_": "CLOUDFLARE_API_TOKEN",
              "CLOUDFLARE_ZONE_ID_": "CLOUDFLARE_ZONE_ID",
              "CLOUDFLARE_ACCOUNT_ID": "CLOUDFLARE_ACCOUNT_ID_",
          }
          keys = [
              "CLOUDFLARE_API_TOKEN_",
              "CLOUDFLARE_ZONE_ID_",
              "CLOUDFLARE_ACCOUNT_ID",
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_REGION",
              "CLERK_PUBLISHABLE_KEY",
              "CLERK_SECRET_KEY",
              "WEWEBPLUS_DATABASE_URL",
              "WEWEBPLUS_SECRETS_KEY",
          ]
          lines = []
          for key in keys:
              value = os.environ.get(key) or os.environ.get(aliases.get(key, ""), "")
              if value:
                  lines.append(f"export {key}={shlex.quote(value)}")
          with open("/tmp/preview-runtime.sh", "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          os.chmod("/tmp/preview-runtime.sh", 0o600)
          print(f"exported {len(lines)} names")
          PY
          {
            if [[ -s /tmp/preview-runtime.sh ]]; then
              cat /tmp/preview-runtime.sh
            fi
            printf '%s\n' \
              'set -euo pipefail' \
              'echo "--- machine ---"' \
              'uname -m' \
              'command -v docker' \
              'docker version' \
              'df -h /' \
              'awk '"'"'/MemTotal|MemAvailable/ { print }'"'"' /proc/meminfo' \
              'if ! command -v git >/dev/null 2>&1; then' \
              '  echo "git is missing" >&2' \
              '  exit 1' \
              'fi' \
              'repo=/workspaces/weaver-plus' \
              'if [[ ! -d "$repo/.git" ]]; then' \
              '  git clone --depth 1 --branch cursor/session-jwt-refresh-bbea https://github.com/Awannaphasch2016/dyad.git "$repo"' \
              'else' \
              '  git -C "$repo" fetch --depth 1 origin cursor/session-jwt-refresh-bbea' \
              '  git -C "$repo" checkout --detach FETCH_HEAD' \
              'fi' \
              'cd "$repo"' \
              'stop_preview() {' \
              '  local number="$1"' \
              '  echo "--- preview ${number} before stop ---"' \
              '  docker ps -a --filter "label=com.docker.compose.project=preview-${number}" --format "{{.Names}} {{.Status}}"' \
              '  if [[ -f "$HOME/.local/state/wewebplus-preview/preview-${number}.env" ]]; then' \
              '    docker compose --env-file "$HOME/.local/state/wewebplus-preview/preview-${number}.env" -p "preview-${number}" -f compose.preview.yml down || true' \
              '  else' \
              '    docker compose -p "preview-${number}" -f compose.preview.yml down || true' \
              '  fi' \
              '}' \
              'stop_preview 43' \
              'stop_preview 44' \
              'stop_preview 46' \
              'echo "--- start preview 48 ---"' \
              'PREVIEW_REQUIRE_BEDROCK=1 PREVIEW_REQUIRE_NAMED_TUNNEL=1 PREVIEW_SKIP_TUNNEL=1 bash scripts/gascity/preview-up.sh 48 ghcr.io/awannaphasch2016/dyad@sha256:8436e5ae78f2e25cbe34d2c8716a0e556e084849695c4112f998b8aa828749f8'
          } > /tmp/preview-remote.sh
          payload="$(base64 -w0 /tmp/preview-remote.sh)"
          rm -f /tmp/preview-runtime.sh /tmp/preview-remote.sh
          devbox exec Wewebplus-ci -- bash -lc "printf '%s' '${payload}' | base64 -d | bash"

      - name: Check the public preview address
        run: |
          set -euo pipefail
          ok=0
          for _ in $(seq 1 18); do
            code="$(curl -sS -o /tmp/preview-body -w '%{http_code}' --max-time 20 https://pr-48.anakwannaphaschaiyong.com/sign-in || true)"
            echo "http ${code}"
            if [[ "$code" == "200" ]] && grep -q 'data-dyad-browser-bridge' /tmp/preview-body; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1"
          echo "browser bridge page"
