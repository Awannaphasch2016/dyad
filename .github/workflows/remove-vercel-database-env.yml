# Remove WEWEBPLUS_DATABASE_URL from Vercel project dyad.
# The one-shot push already deleted the Production and Preview records.
# This file now runs only from a manual dispatch.

name: Remove Vercel database env

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove:
    if: github.ref == 'refs/heads/cursor/ecs-hitl-cutover-bbea'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Delete the database variable
        env:
          VERCEL_ANAK2_TOKEN: ${{ secrets.VERCEL_ANAK2_TOKEN }}
        run: node deploy/preview/remove-vercel-database-env.mjs
