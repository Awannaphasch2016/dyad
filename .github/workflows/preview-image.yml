# Publish the Gas City image digest for preview use.
#
# This workflow does not SSH, does not read EC2_SSH_KEY, and does not run
# gascity-rollout. The production host does not pull the image.
name: Preview image

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/preview-bridge-proof-9e7a

permissions:
  contents: read
  packages: write

concurrency:
  group: preview-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this commit is already published
        id: inspect
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/dyad:sha-${SHA}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Already published: $image"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Not published yet: $image"
          fi

      - name: Free runner disk before the image build
        if: steps.inspect.outputs.published != 'true'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Build and push
        id: build
        if: steps.inspect.outputs.published != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gascity
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.inspect.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Report
        run: |
          set -euo pipefail
          if [ "${{ steps.inspect.outputs.published }}" = "true" ]; then
            echo "Skipped the build. ${{ steps.inspect.outputs.image }} already exists."
          else
            echo "Pushed ${{ steps.inspect.outputs.image }}"
            echo "Digest ${{ steps.build.outputs.digest }}"
          fi
