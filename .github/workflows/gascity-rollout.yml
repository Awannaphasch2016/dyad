# Roll the Gas City EC2 host forward after CI passes for this commit.
#
# workflow_run only fires from the default branch, so this workflow triggers
# on a push to the Gas City branch and waits until ci.yml succeeds for the
# same SHA. GitHub Actions SSHs to the host and forwards the short-lived
# Doppler token from .github/actions/doppler-oidc. The host runs doppler and
# Dagger. The token is not written to disk.
name: Gas City rollout

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit SHA to roll out. Defaults to the branch tip.
        required: false
        type: string
  push:
    branches:
      - cursor/browser-dyad-ui-bbea

permissions:
  contents: read
  actions: read
  checks: read
  id-token: write

concurrency:
  group: gascity-rollout
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_COMMIT" ]; then
            sha="$INPUT_COMMIT"
          else
            sha="$GITHUB_SHA"
          fi
          if ! [[ "$sha" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "Refusing commit that is not a hex sha" >&2
            exit 2
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Wait for CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 5400))
          while true; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "CI did not succeed for $TARGET_SHA within 90 minutes" >&2
              exit 1
            fi
            json="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$TARGET_SHA" --workflow ci.yml --limit 20 --json databaseId,status,conclusion,headSha)"
            decision="$(printf '%s' "$json" | jq -r '
              if any(.[]; .conclusion == "success") then "success"
              elif any(.[]; .status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested") then "wait"
              elif length > 0 then "fail"
              else "wait"
              end
            ')"
            echo "CI for $TARGET_SHA: $decision"
            if [ "$decision" = "success" ]; then
              exit 0
            fi
            if [ "$decision" = "fail" ]; then
              echo "CI did not succeed for $TARGET_SHA" >&2
              exit 1
            fi
            sleep 30
          done

      - name: Log in to Doppler by OIDC
        id: doppler
        uses: ./.github/actions/doppler-oidc
        with:
          identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}

      - name: Fetch the SSH key from Doppler when GitHub has none
        if: steps.doppler.outputs.ok == 'true'
        env:
          SYNCED_EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${SYNCED_EC2_SSH_KEY//[[:space:]]/}" ]]; then
            echo "ec2_ssh_key_fetch=skipped reason=github-secret-present"
            exit 0
          fi
          status="$(curl -sS -o "$RUNNER_TEMP/key.json" -w '%{http_code}' \
            -H "Authorization: Bearer ${DOPPLER_TOKEN}" \
            "https://api.doppler.com/v3/configs/config/secret?project=dyad&config=preview&name=EC2_SSH_KEY" || echo 000)"
          echo "ec2_ssh_key_fetch=http-${status} project=dyad config=preview"
          if [[ "$status" == "200" ]]; then
            umask 077
            jq -r '.value.computed // empty' "$RUNNER_TEMP/key.json" > "$RUNNER_TEMP/gascity-ec2"
            [[ -s "$RUNNER_TEMP/gascity-ec2" ]] || rm -f "$RUNNER_TEMP/gascity-ec2"
          fi
          rm -f "$RUNNER_TEMP/key.json"

      - name: Roll out over SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          keyfile="$RUNNER_TEMP/gascity-ec2"
          if [[ ! -f "$keyfile" ]]; then
            python3 scripts/gascity/write_ssh_key.py "$keyfile"
          fi
          # The wrapper is piped so the outer phase is this commit's script.
          # It fast-forwards the host checkout and re-execs that copy. sudo
          # keeps only DOPPLER_TOKEN; the token is masked and not written down.
          prefix=""
          if [[ -n "${DOPPLER_TOKEN:-}" ]]; then
            prefix="DOPPLER_TOKEN=$(printf '%q' "$DOPPLER_TOKEN") "
          fi
          ssh -i "$keyfile" \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/.github/gascity_known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            ubuntu@13.251.216.187 \
            "${prefix}sudo --preserve-env=DOPPLER_TOKEN bash -s -- ${TARGET_SHA}" \
            < scripts/gascity/host-wrapper.sh
