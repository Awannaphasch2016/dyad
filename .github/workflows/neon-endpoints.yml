# One-shot map of Neon branch names to endpoint ids. Prints no secrets.
# Removed after the production database host is identified.

name: Neon endpoint map

on:
  push:
    branches:
      - cursor/ecs-hitl-cutover-bbea
    paths:
      - .github/workflows/neon-endpoints.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: neon-endpoint-map
  cancel-in-progress: true

jobs:
  map:
    if: github.ref == 'refs/heads/cursor/ecs-hitl-cutover-bbea'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print the GitHub OIDC subject
        env:
          AUDIENCE: https://github.com/Awannaphasch2016
        run: |
          set -euo pipefail
          response="$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          python3 -c 'import json,base64,sys
          response=json.loads(sys.stdin.read())
          payload=response["value"].split(".")[1]
          payload += "=" * ((4 - len(payload) % 4) % 4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          print("aud="+json.dumps(claims.get("aud")))
          print("sub="+str(claims.get("sub","")))
          print("ref="+str(claims.get("ref","")))' <<<"$response"

      - name: Fetch dyad preview secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: 18edf96d-89e6-40f6-87aa-073c11a02e14
          doppler-project: dyad
          doppler-config: preview
          inject-env-vars: true

      - name: Print branch endpoint ids
        env:
          PROJECT: mute-credit-71067312
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          key = os.environ.get("NEON_API_KEY", "")
          if not key:
              print("NEON_API_KEY absent")
              raise SystemExit(1)
          target = "ep-young-wave-b3cwe0rz"
          known = os.environ["PROJECT"]
          def get(path):
              req = urllib.request.Request(
                  "https://console.neon.tech/api/v2" + path,
                  headers={"Authorization": "Bearer " + key, "Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as err:
                  raw = err.read().decode("utf-8", "replace")[:180]
                  message = raw
                  try:
                      message = json.loads(raw).get("message", raw)
                  except json.JSONDecodeError:
                      pass
                  print(f"http_error status={err.code} path={path.split('?')[0]} message={message}")
                  raise
          def pages(path, field):
              items = []
              cursor = ""
              seen = set()
              for _ in range(10):
                  query = path
                  if cursor:
                      if cursor in seen:
                          print(f"cursor_repeat path={path.split('?')[0]}")
                          return items
                      seen.add(cursor)
                      sep = "&" if "?" in path else "?"
                      query = path + sep + "cursor=" + urllib.parse.quote(cursor)
                  payload = get(query)
                  batch = payload.get(field, [])
                  items.extend(batch)
                  cursor = (payload.get("pagination") or {}).get("cursor") or ""
                  if not cursor or not batch:
                      return items
              print(f"page_cap path={path.split('?')[0]} count={len(items)}")
              return items
          orgs = get("/users/me/organizations").get("organizations", [])
          print(f"org_count={len(orgs)}")
          matched = 0
          project_count = 0
          for org in orgs:
              oid = org.get("id") or ""
              print(f"org {org.get('name')} {oid}")
              projects = pages(f"/projects?org_id={urllib.parse.quote(oid)}&limit=400", "projects")
              project_count += len(projects)
              for project in projects:
                  pid = project.get("id") or ""
                  pname = project.get("name") or ""
                  branches = {
                      b["id"]: b.get("name")
                      for b in pages(f"/projects/{pid}/branches?limit=400", "branches")
                  }
                  endpoints = pages(f"/projects/{pid}/endpoints?limit=400", "endpoints")
                  print(
                      f"project {pname} {pid} endpoints={len(endpoints)} "
                      + f"known={'yes' if pid == known else 'no'}"
                  )
                  for ep in endpoints:
                      host = ep.get("host") or ""
                      label = host.split(".")[0]
                      bare = label.removesuffix("-pooler")
                      eid = ep.get("id") or ""
                      if target in (bare, eid):
                          matched += 1
                          print(
                              "match "
                              + f"{pname} {pid} {branches.get(ep.get('branch_id'), '?')} "
                              + f"{ep.get('branch_id')} {eid} {label}"
                          )
          print(f"project_count={project_count}")
          print(f"match_count={matched}")
          if matched == 0:
              raise SystemExit(2)
          PY
