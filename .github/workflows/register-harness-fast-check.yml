name: Register Harness fast-check pipeline

on:
  push:
    branches:
      - cursor/harness-equivalence-5527
    paths:
      - .github/workflows/register-harness-fast-check.yml
      - deploy/harness/fast-check.yaml

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Create the fast-check pipeline in Harness
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          HARNESS_ACCOUNT: WKxXBnSFTRaOF64-h90PyQ
        run: |
          python3 << 'PY'
          import json, os, subprocess
          from pathlib import Path

          api_key = os.environ.get("HARNESS_API_KEY") or ""
          account = os.environ["HARNESS_ACCOUNT"]
          org = "default"
          project = "dyad"
          pipeline = "dyad_fast_check"
          pipeline_yaml = Path("deploy/harness/fast-check.yaml").read_text()

          def fail(message):
              print(message[:500])
              raise SystemExit(1)

          if not api_key.strip():
              fail("HARNESS_API_KEY_ABSENT")

          def request(method, url, payload=None, yaml_path=None):
              out = Path("/tmp/harness-response.json")
              if out.exists():
                  out.unlink()
              cmd = [
                  "curl", "-sS", "-o", str(out), "-w", "%{http_code}",
                  "-X", method, url,
                  "-H", f"x-api-key: {api_key}",
                  "-H", "Accept: application/json",
              ]
              if payload is not None:
                  body = Path("/tmp/harness-request.json")
                  body.write_text(json.dumps(payload))
                  cmd += ["-H", "Content-Type: application/json", "--data-binary", f"@{body}"]
              if yaml_path is not None:
                  cmd += ["-H", "Content-Type: application/yaml", "--data-binary", f"@{yaml_path}"]
              result = subprocess.run(cmd, text=True, capture_output=True)
              if result.returncode != 0:
                  fail("CURL_FAILED " + result.stderr[:300])
              raw = out.read_text() if out.exists() else ""
              out.unlink(missing_ok=True)
              try:
                  parsed = json.loads(raw) if raw else {}
              except json.JSONDecodeError:
                  parsed = {"raw": raw[:300]}
              return result.stdout.strip(), parsed

          def brief(label, code, body):
              data = body.get("data") if isinstance(body.get("data"), dict) else {}
              print(json.dumps({
                  "step": label,
                  "http": code,
                  "status": body.get("status"),
                  "code": body.get("code"),
                  "message": str(body.get("message") or "")[:300],
                  "identifier": (
                      (data.get("organization") or {}).get("identifier")
                      or (data.get("project") or {}).get("identifier")
                      or (data.get("pipeline") or {}).get("identifier")
                      or data.get("planExecutionId")
                      or data.get("executionId")
                  ),
              }))

          code, orgs = request(
              "GET",
              f"https://app.harness.io/ng/api/organizations?accountIdentifier={account}",
          )
          identifiers = []
          content = ((orgs.get("data") or {}).get("content") or []) if isinstance(orgs.get("data"), dict) else []
          for item in content:
              org_item = item.get("organization") or item
              if org_item.get("identifier"):
                  identifiers.append(org_item["identifier"])
          print("orgs", ",".join(identifiers) or "(none)")
          if org not in identifiers:
              code, created = request(
                  "POST",
                  f"https://app.harness.io/ng/api/organizations?accountIdentifier={account}",
                  {"organization": {"name": "default", "identifier": org}},
              )
              brief("create_org", code, created)
              if code not in {"200", "201"} and "already" not in str(created.get("message") or "").lower():
                  fail("ORG_CREATE_FAILED")

          code, created = request(
              "POST",
              f"https://app.harness.io/ng/api/projects?accountIdentifier={account}&orgIdentifier={org}",
              {"project": {
                  "name": "Dyad",
                  "identifier": project,
                  "orgIdentifier": org,
                  "description": "Harness equivalence experiments",
              }},
          )
          brief("create_project", code, created)
          message = str(created.get("message") or "").lower()
          if code not in {"200", "201"} and "already" not in message and "duplicate" not in message:
              fail("PROJECT_CREATE_FAILED")

          yaml_path = Path("/tmp/fast-check.yaml")
          yaml_path.write_text(pipeline_yaml)
          create_url = (
              "https://app.harness.io/pipeline/api/pipelines/v2"
              f"?accountIdentifier={account}&orgIdentifier={org}&projectIdentifier={project}"
          )
          code, created = request("POST", create_url, yaml_path=yaml_path)
          brief("create_pipeline", code, created)
          message = str(created.get("message") or "").lower()
          if code not in {"200", "201"} or created.get("status") not in {None, "SUCCESS"}:
              if "already" in message or "duplicate" in message or "exist" in message:
                  update_url = (
                      "https://app.harness.io/pipeline/api/pipelines/v2/"
                      f"{pipeline}?accountIdentifier={account}&orgIdentifier={org}&projectIdentifier={project}"
                  )
                  code, created = request("PUT", update_url, yaml_path=yaml_path)
                  brief("update_pipeline", code, created)
              else:
                  fail("PIPELINE_CREATE_FAILED")
          if code not in {"200", "201"} or created.get("status") not in {None, "SUCCESS"}:
              fail("PIPELINE_SAVE_FAILED")
          print("PIPELINE_READY dyad_fast_check")

          execute_url = (
              "https://app.harness.io/pipeline/api/pipeline/execute/"
              f"{pipeline}?accountIdentifier={account}&orgIdentifier={org}"
              f"&projectIdentifier={project}&moduleType=CI"
          )
          code, started = request("POST", execute_url, {})
          brief("execute_pipeline", code, started)
          if code in {"200", "201"} and started.get("status") in {None, "SUCCESS"}:
              print("EXECUTION_STARTED")
          else:
              print("EXECUTION_NOT_STARTED")
          PY
