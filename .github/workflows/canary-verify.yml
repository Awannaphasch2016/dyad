# Prove the canary Doppler identity and database host.
# The identity subject is this workflow on cursor/ecs-hitl-cutover-bbea.
# Set the Actions variable DOPPLER_CANARY_IDENTITY_ID to the UUID from the
# wewebplus-canary GitHub identity. A repository secret named
# DOPPLER_ADMIN_TOKEN can create that identity once. This workflow does not roll gascity-server,
# move the apex, or promote canary to prd.

name: Canary verify

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the canary images and register the ECS service
        required: false
        type: boolean
        default: false
  push:
    branches:
      - cursor/ecs-hitl-cutover-bbea
    paths:
      - .github/workflows/canary-verify.yml
      - scripts/gascity/canary-identity.mjs
      - scripts/gascity/ensure-canary-identity.mjs
      - scripts/gascity/canary-hosts.mjs
      - scripts/gascity/model-keys.mjs
      - scripts/gascity/copy-canary-model-keys.mjs
      - src/main/browser_bridge.ts
      - src/main/browser_bridge.test.ts
      - src/preview_iframe/public_preview_url.ts
      - src/preview_iframe/public_preview_url.test.ts
      - src/main/factory_host_bridge_hitl.test.ts
      - src/control_plane/access.ts
      - src/control_plane/access.test.ts
      - src/ipc/utils/start_proxy_server.ts
      - src/__tests__/proxy_server_csp.test.ts
      - worker/proxy_server.js
      - deploy/canary/**
      - services/gascity-supervisor/**

permissions:
  contents: read
  id-token: write

concurrency:
  group: canary-verify
  cancel-in-progress: false

jobs:
  identity:
    if: github.ref == 'refs/heads/cursor/ecs-hitl-cutover-bbea'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      identity_id: ${{ steps.ensure.outputs.identity_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use the configured canary identity
        id: ensure
        env:
          CONFIGURED_IDENTITY: ${{ vars.DOPPLER_CANARY_IDENTITY_ID }}
          DEFAULT_IDENTITY: e2e3ffc6-5280-4cc4-b831-751f3ffb6d0d
        run: |
          set -euo pipefail
          identity="$CONFIGURED_IDENTITY"
          if [[ ! "$identity" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            identity="$DEFAULT_IDENTITY"
          fi
          echo "identity_id=$identity" >> "$GITHUB_OUTPUT"
          echo "identity=$identity"

  read:
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch dyad canary secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ needs.identity.outputs.identity_id }}
          doppler-project: dyad
          doppler-config: canary
          inject-env-vars: true

      - name: Print the canary database host
        run: |
          set -euo pipefail
          node --input-type=module << 'JS'
          import { hostLabel } from "./scripts/gascity/canary-hosts.mjs";
          import {
            bareEndpoint,
            canaryEndpoint,
            hitlPrdBranchEndpoint,
            productionEndpoint,
          } from "./scripts/gascity/pre-promotion-verdict.mjs";
          const label = hostLabel(process.env.WEWEBPLUS_DATABASE_URL ?? "");
          const bare = bareEndpoint(label);
          console.log(`canary_db=${label}`);
          console.log(`canary_db_is_recorded_pre=${bare === canaryEndpoint ? "yes" : "no"}`);
          if (!bare || bare === productionEndpoint || bare === hitlPrdBranchEndpoint) {
            console.error("canary_db_rejected");
            process.exit(1);
          }
          JS

      - name: Confirm the canary identity cannot read production
        id: prd
        continue-on-error: true
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ needs.identity.outputs.identity_id }}
          doppler-project: dyad
          doppler-config: prd
          inject-env-vars: false

      - name: Require the production read to fail
        run: |
          set -euo pipefail
          if [ "${{ steps.prd.outcome }}" = "success" ]; then
            echo "canary identity read dyad/prd"
            exit 1
          fi
          echo "prd_read=denied"

  deploy:
    needs: [identity, read]
    if: github.ref == 'refs/heads/cursor/ecs-hitl-cutover-bbea'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Copy missing edge names
        env:
          DOPPLER_ADMIN_TOKEN: ${{ secrets.DOPPLER_ADMIN_TOKEN }}
        run: node scripts/gascity/copy-canary-edge.mjs

      - name: Copy model keys from dyad dev
        env:
          DOPPLER_ADMIN_TOKEN: ${{ secrets.DOPPLER_ADMIN_TOKEN }}
        run: node scripts/gascity/copy-canary-model-keys.mjs

      - name: Fetch dyad canary secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ needs.identity.outputs.identity_id }}
          doppler-project: dyad
          doppler-config: canary
          inject-env-vars: true

      - name: Require canary runtime names
        run: |
          set -euo pipefail
          node --input-type=module << 'JS'
          import { missingNames } from "./deploy/canary/preflight.mjs";
          import { cloudflareConfig } from "./deploy/canary/tunnel.mjs";
          const missing = missingNames(process.env);
          console.log(`missing=${missing.join(",") || "none"}`);
          const edge = cloudflareConfig(process.env);
          console.log(`cloudflare=${edge.apiToken && edge.zoneId && edge.accountId ? "present" : "absent"}`);
          if (missing.length > 0 || !edge.apiToken || !edge.zoneId || !edge.accountId) process.exit(1);
          JS

      - name: Allow the canary hostname in Clerk
        env:
          PREVIEW_ORIGIN: https://pre.anakwannaphaschaiyong.com
        run: |
          set -euo pipefail
          node --input-type=module << 'JS'
          import { run } from "./deploy/preview/clerk-origins.mjs";
          await run();
          JS

      - name: Route the canary hostname
        run: |
          set -euo pipefail
          node --input-type=module << 'JS'
          import { writeFile } from "node:fs/promises";
          import { cloudflareConfig, ensureCanaryTunnel } from "./deploy/canary/tunnel.mjs";
          const config = cloudflareConfig(process.env);
          const result = await ensureCanaryTunnel({
            ...config,
            writeToken: (token) => writeFile("/tmp/tunnel-token", token, { mode: 0o600 }),
          });
          console.log(`canary_hostname=${result.hostname}`);
          console.log(`tunnel_id=${result.tunnelId}`);
          JS

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Publish the canary images
        run: |
          set -euo pipefail
          export AWS_DEFAULT_REGION=ap-southeast-1
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account}.dkr.ecr.ap-southeast-1.amazonaws.com"
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin "$registry"
          # ECR tags on these repositories are immutable, so each publish
          # gets its own tag. The moving tags canary and supervisor stay as
          # the first images and are not overwritten.
          tag="${GITHUB_SHA::12}"
          dyad="${registry}/wewebplus-dyad:canary-${tag}"
          supervisor="${registry}/wewebplus-gascity:supervisor-${tag}"
          docker build -f services/gascity-supervisor/Dockerfile -t "$supervisor" services/gascity-supervisor
          docker build -f Dockerfile.gascity -t "$dyad" .
          docker push "$supervisor"
          docker push "$dyad"
          echo "DYAD_IMAGE=$dyad" >> "$GITHUB_ENV"
          echo "SUPERVISOR_IMAGE=$supervisor" >> "$GITHUB_ENV"

      - name: Register the canary service
        run: bash deploy/canary/register.sh
