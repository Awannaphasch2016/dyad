# Create allowlisted preview names in Doppler. Does not build or deploy the formula task.
name: Formula preview secrets

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/formula-config-ui-55d6
      - cursor/doppler-add-env-plan-55d6
    paths:
      - scripts/gascity/store_formula_supervisor.py
      - scripts/gascity/store_formula_supervisor_job.sh
      - scripts/gascity/formula_supervisor_select.py
      - scripts/gascity/read_formula_supervisor_env.py
      - .github/workflows/preview-formula-secrets.yml

permissions:
  contents: read

jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Store the GasCity supervisor settings
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_ADMIN_TOKEN: ${{ secrets.DOPPLER_ADMIN_TOKEN }}
          GAS_CITY_SUPERVISOR_URL: ${{ secrets.GAS_CITY_SUPERVISOR_URL }}
          GAS_CITY_CITY_NAME: ${{ secrets.GAS_CITY_CITY_NAME }}
          GAS_CITY_CITY_WRITE_GRANT: ${{ secrets.GAS_CITY_CITY_WRITE_GRANT }}
        run: bash scripts/gascity/store_formula_supervisor_job.sh
