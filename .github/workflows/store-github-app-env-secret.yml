name: Store GitHub App environment secret

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/store-github-app-env-secret.yml
      - .github/scripts/store-github-app-env-secret.mjs

permissions:
  contents: read

concurrency:
  group: store-github-app-env-secret
  cancel-in-progress: false

jobs:
  store-secret:
    runs-on: ubuntu-latest
    environment: ai-bots
    steps:
      - uses: actions/checkout@v5

      - name: Save the app private key on ai-bots
        env:
          PEM: ${{ secrets.DYAD_GITHUB_APP_PEM_KEY }}
          APP_ID: ${{ vars.DYAD_GITHUB_APP_ID }}
        run: node .github/scripts/store-github-app-env-secret.mjs
