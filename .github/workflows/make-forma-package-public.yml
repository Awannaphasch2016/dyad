name: Make Forma package public

# One shot. Sets ghcr.io/awannaphasch2016/forma to public. Do not merge.

on:
  push:
    branches:
      - cursor/forma-package-public-5014
    paths:
      - .github/workflows/make-forma-package-public.yml
      - .github/scripts/make-forma-package-public.mjs
      - .github/scripts/make-forma-package-public.test.mjs

permissions:
  contents: read

jobs:
  public:
    if: github.ref == 'refs/heads/cursor/forma-package-public-5014'
    runs-on: ubuntu-latest
    environment: ai-bots
    timeout-minutes: 15
    steps:
      - name: Check out the visibility script
        uses: actions/checkout@v5

      - name: Create the app token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DYAD_GITHUB_APP_ID || '5221649' }}
          private-key: ${{ secrets.DYAD_GITHUB_APP_PEM_KEY }}
          owner: Awannaphasch2016
          repositories: forma
          permission-contents: write
          permission-packages: write
          permission-workflows: write

      - name: Make the Forma package public
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          set +x
          node .github/scripts/make-forma-package-public.mjs
