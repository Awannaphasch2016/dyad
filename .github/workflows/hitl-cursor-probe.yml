# P2: read the Cursor token from Doppler dyad/preview and aws/dev, then
# call the Cloud Agents API. The job prints key type, run ids, and
# statuses. It does not print the token or other Doppler values.
name: HITL Cursor key probe

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/hitl-experiment-b-d072
    paths:
      - .github/workflows/hitl-cursor-probe.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: hitl-cursor-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require the Doppler identity
        env:
          DOPPLER_IDENTITY: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
        run: |
          set -euo pipefail
          if [ -z "$DOPPLER_IDENTITY" ]; then
            echo "DOPPLER_SERVICE_IDENTITY_ID absent"
            exit 1
          fi
          echo "DOPPLER_SERVICE_IDENTITY_ID present"

      - name: Fetch dyad preview secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          doppler-project: dyad
          doppler-config: preview
          inject-env-vars: true

      - name: Note Cursor names from dyad/preview
        run: |
          node - <<'NODE'
          const names = Object.keys(process.env)
            .filter((name) => /CURSOR/i.test(name) && /(KEY|TOKEN|SECRET)/i.test(name))
            .sort();
          console.log(
            names.length
              ? `dyad/preview cursor names: ${names.join(",")}`
              : "dyad/preview cursor names: none",
          );
          NODE

      - name: Fetch aws dev secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          doppler-project: aws
          doppler-config: dev
          inject-env-vars: true

      - name: Probe the Cursor key
        run: |
          node - <<'NODE'
          const NAMES = [
            "CURSOR_API_KEY",
            "CURSOR_TOKEN",
            "CURSOR_API_TOKEN",
            "CURSOR_USER_API_KEY",
            "CURSOR_CLOUD_API_KEY",
          ];
          const discovered = Object.keys(process.env)
            .filter(
              (name) => /CURSOR/i.test(name) && /(KEY|TOKEN|SECRET)/i.test(name),
            )
            .sort();
          console.log(
            discovered.length
              ? `cursor names after preview and dev: ${discovered.join(",")}`
              : "cursor names after preview and dev: none",
          );
          const keyName =
            NAMES.find((name) => process.env[name]?.trim()) ??
            discovered.find((name) => process.env[name]?.trim());
          if (!keyName) {
            console.log("cursor token absent");
            process.exit(1);
          }
          const key = process.env[keyName].trim();
          process.stdout.write(`::add-mask::${key}\n`);
          for (const name of discovered) {
            const value = process.env[name]?.trim();
            if (value) process.stdout.write(`::add-mask::${value}\n`);
          }
          console.log(`cursor token name: ${keyName}`);

          function redact(value) {
            let text = String(value ?? "");
            if (key) text = text.split(key).join("[redacted]");
            return text.slice(0, 240);
          }

          async function api(method, path, body) {
            const response = await fetch(`https://api.cursor.com${path}`, {
              method,
              headers: {
                Authorization: `Basic ${Buffer.from(`${key}:`).toString("base64")}`,
                Accept: "application/json",
                ...(body ? { "Content-Type": "application/json" } : {}),
              },
              body: body ? JSON.stringify(body) : undefined,
            });
            const text = await response.text();
            let json = null;
            try {
              json = JSON.parse(text);
            } catch {
              json = null;
            }
            return { status: response.status, json, text };
          }

          function errorCode(result) {
            const code = result.json?.code ?? result.json?.error?.code;
            const message =
              result.json?.message ?? result.json?.error?.message ?? result.text;
            return `${result.status} ${code ?? ""} ${redact(message)}`.trim();
          }

          function classify(me) {
            if (!me || typeof me !== "object") return "unknown";
            const role = [me.role, me.teamRole, me.membershipRole]
              .filter((value) => typeof value === "string")
              .join(" ");
            if (/admin/i.test(role)) return "team-admin";
            if (me.userId != null) return "user";
            return "service-account";
          }

          const terminal = new Set(["FINISHED", "ERROR", "CANCELLED", "EXPIRED"]);
          const statuses = [];

          async function waitForRun(agentId, runId) {
            const started = Date.now();
            let last = null;
            while (Date.now() - started < 10 * 60 * 1000) {
              const result = await api(
                "GET",
                `/v1/agents/${agentId}/runs/${runId}`,
              );
              if (result.status !== 200) {
                throw new Error(`poll ${errorCode(result)}`);
              }
              last = result.json;
              const status = String(last.status ?? "");
              if (statuses.at(-1) !== status) statuses.push(status);
              if (terminal.has(status)) return last;
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            throw new Error("poll timed out");
          }

          const me = await api("GET", "/v1/me");
          if (me.status !== 200) {
            console.log(`GET /v1/me failed: ${errorCode(me)}`);
            process.exit(1);
          }
          const fields = Object.keys(me.json).sort();
          const keyType = classify(me.json);
          console.log(`key_type=${keyType}`);
          console.log(`me_fields=${fields.join(",")}`);
          console.log(`me_has_user_id=${me.json.userId != null}`);
          console.log(`me_has_email=${typeof me.json.userEmail === "string"}`);
          console.log(`api_key_name=${redact(me.json.apiKeyName ?? "")}`);

          const webhookPaths = ["/v1/webhooks", "/v0/webhooks", "/v0/hooks"];
          let webhookExists = false;
          for (const path of webhookPaths) {
            const result = await api("GET", path);
            const items = Array.isArray(result.json?.items)
              ? result.json.items.length
              : Array.isArray(result.json)
                ? result.json.length
                : null;
            console.log(
              `webhook ${path} status=${result.status} items=${items ?? "n/a"}`,
            );
            if (result.status === 200 && items !== 0) webhookExists = true;
            if (result.status === 200 && items === null) webhookExists = true;
          }
          console.log(`webhook_exists=${webhookExists}`);

          let agentId = null;
          try {
            const created = await api("POST", "/v1/agents", {
              name: "p2 key probe",
              mode: "plan",
              autoCreatePR: false,
              prompt: {
                text: "Reply with exactly the word pong. Do not change files and do not open a pull request.",
              },
            });
            if (created.status !== 200 && created.status !== 201) {
              console.log(`POST /v1/agents failed: ${errorCode(created)}`);
              process.exit(1);
            }
            agentId = created.json?.agent?.id ?? null;
            const firstRunId = created.json?.run?.id ?? null;
            console.log(`agent_id=${agentId}`);
            console.log(`first_run_id=${firstRunId}`);
            if (!agentId || !firstRunId) {
              console.log("create response missing agent or run id");
              process.exit(1);
            }
            const first = await waitForRun(agentId, firstRunId);
            console.log(`first_status=${first.status}`);
            console.log(`first_result=${redact(first.result ?? "")}`);

            const follow = await api("POST", `/v1/agents/${agentId}/runs`, {
              mode: "plan",
              prompt: {
                text: "Reply with exactly the word pong-2. Do not change files.",
              },
            });
            if (follow.status !== 200 && follow.status !== 201) {
              console.log(`follow-up failed: ${errorCode(follow)}`);
              process.exit(1);
            }
            const secondRunId = follow.json?.run?.id ?? null;
            console.log(`second_run_id=${secondRunId}`);
            console.log(
              `follow_up_new_run_id=${Boolean(secondRunId) && secondRunId !== firstRunId}`,
            );
            if (!secondRunId) process.exit(1);
            const second = await waitForRun(agentId, secondRunId);
            console.log(`second_status=${second.status}`);
            console.log(`second_result=${redact(second.result ?? "")}`);
            console.log(`statuses=${statuses.join(",")}`);
          } finally {
            if (agentId) {
              const removed = await api("DELETE", `/v1/agents/${agentId}`);
              console.log(`delete_agent_status=${removed.status}`);
            }
          }
          NODE
