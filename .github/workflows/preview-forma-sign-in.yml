name: preview-forma-sign-in

# One deploy of the Forma shared sign-in commit. Delete this file after the
# run starts so later pushes to this branch do not deploy again.

on:
  push:
    branches: [cursor/preview-forma-workflow-5014]
    paths:
      - .github/workflows/preview-forma-sign-in.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ai-bots
    timeout-minutes: 45
    steps:
      - name: Check out the preview runner
        uses: actions/checkout@v5

      - name: Create a Forma app token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DYAD_GITHUB_APP_ID || '5221649' }}
          private-key: ${{ secrets.DYAD_GITHUB_APP_PEM_KEY }}
          owner: Awannaphasch2016
          repositories: forma
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install pnpm
        run: |
          set -euo pipefail
          set +x
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Open the Forma sign-in pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          set +x
          number=$(gh api "repos/Awannaphasch2016/forma/pulls?state=open&head=Awannaphasch2016:cursor/forma-shared-auth-5014" --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create \
              --repo Awannaphasch2016/forma \
              --base main \
              --head cursor/forma-shared-auth-5014 \
              --title "Sign in with the shared Wewebplus account" \
              --body "Replaces the workspace password with the Clerk Development session and the Wewebplus membership role."
            number=$(gh api "repos/Awannaphasch2016/forma/pulls?state=open&head=Awannaphasch2016:cursor/forma-shared-auth-5014" --jq '.[0].number')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "forma_pr=$number"

      - name: Deploy the Forma sign-in preview
        env:
          DOPPLER_ADMIN_TOKEN: ${{ secrets.DOPPLER_ADMIN_TOKEN }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          FORMA_PR: ${{ steps.pr.outputs.number }}
          FORMA_SHA: 53191a6e7b317f7927eaa77e10bbf3e2b996cad1
          FORMA_ENVIRONMENT: preview
        run: |
          set -euo pipefail
          set +x
          node scripts/gascity/forma-preview.mjs
