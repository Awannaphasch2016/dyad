# Registers the GHCR auth probe and prints its result. Does not start the image build.
name: Register Harness GHCR auth probe

on:
  push:
    branches:
      - cursor/harness-images-5527
    paths:
      - .github/workflows/register-harness-ghcr-auth.yml
      - deploy/harness/ghcr-auth.yaml
      - scripts/harness/ghcr_app_login.py

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run the auth probe and print the result
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          HARNESS_ACCOUNT: WKxXBnSFTRaOF64-h90PyQ
          GHCR_PUSH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN }}
        run: |
          python3 << 'PY'
          import json, os, re, subprocess, time, zipfile
          from pathlib import Path
          from urllib.parse import quote

          api_key = os.environ["HARNESS_API_KEY"]
          account = os.environ["HARNESS_ACCOUNT"]
          pipeline = "dyad_ghcr_auth"
          long_token = re.compile(r"ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|ghs_[A-Za-z0-9_]+|[A-Za-z0-9+/=]{40,}")

          def scrub(text):
              return long_token.sub("[redacted]", text or "")

          def request(method, url, yaml_path=None, payload=None):
              out = Path("/tmp/harness-auth.bin")
              out.unlink(missing_ok=True)
              cmd = [
                  "curl", "-sS", "--max-time", "60", "-o", str(out), "-w", "%{http_code}",
                  "-X", method, url, "-H", f"x-api-key: {api_key}",
              ]
              if yaml_path is not None:
                  cmd += ["-H", "Content-Type: application/yaml", "--data-binary", f"@{yaml_path}"]
              elif payload is not None:
                  body = Path("/tmp/harness-auth.json")
                  body.write_text(json.dumps(payload))
                  cmd += ["-H", "Content-Type: application/json", "--data-binary", f"@{body}"]
              result = subprocess.run(cmd, text=True, capture_output=True)
              if result.returncode != 0:
                  print("CURL_FAILED", scrub(result.stderr)[:200])
                  raise SystemExit(1)
              raw = scrub(out.read_text("utf-8", "replace")) if out.exists() else ""
              out.unlink(missing_ok=True)
              body_file = Path("/tmp/harness-auth.json")
              body_file.unlink(missing_ok=True)
              try:
                  parsed = json.loads(raw) if raw else {}
              except json.JSONDecodeError:
                  parsed = {"raw": raw[:300]}
              return result.stdout.strip(), parsed

          pat = os.environ.get("GHCR_PUSH_TOKEN", "")
          if pat.startswith("ghp_"):
              pat_kind = "classic"
          elif pat.startswith("github_pat_"):
              pat_kind = "fine_grained"
          elif pat:
              pat_kind = "other"
          else:
              pat_kind = "empty"
          print("push_token_kind", pat_kind, "token_len", len(pat))
          if pat_kind == "empty" or len(pat) < 20:
              raise SystemExit(1)
          secret_id = "ghcr_push_token"
          secret_payload = {
              "secret": {
                  "type": "SecretText",
                  "name": "ghcr-push-token",
                  "identifier": secret_id,
                  "description": "Classic token used only to push harness- image tags.",
                  "spec": {
                      "secretManagerIdentifier": "harnessSecretManager",
                      "valueType": "Inline",
                      "value": pat,
                  },
              }
          }
          account_query = f"?accountIdentifier={account}"
          code, body = request(
              "POST",
              f"https://app.harness.io/ng/api/v2/secrets{account_query}",
              payload=secret_payload,
          )
          print("create_text_secret", code, body.get("status"))
          if code not in {"200", "201"}:
              code, body = request(
                  "PUT",
                  f"https://app.harness.io/ng/api/v2/secrets/{secret_id}{account_query}",
                  payload=secret_payload,
              )
              print("update_text_secret", code, body.get("status"))
              if code not in {"200", "201"}:
                  raise SystemExit(1)
          del pat
          del secret_payload

          query = f"?accountIdentifier={account}&orgIdentifier=default&projectIdentifier=dyad"
          code, body = request(
              "POST",
              f"https://app.harness.io/pipeline/api/pipelines/v2{query}",
              yaml_path="deploy/harness/ghcr-auth.yaml",
          )
          message = str(body.get("message") or "")
          print("create_pipeline", code, body.get("status"), scrub(message)[:300])
          if code not in {"200", "201"} and "exist" not in message.lower():
              raise SystemExit(1)
          if code not in {"200", "201"}:
              code, body = request(
                  "PUT",
                  f"https://app.harness.io/pipeline/api/pipelines/v2/{pipeline}{query}",
                  yaml_path="deploy/harness/ghcr-auth.yaml",
              )
              print("update_pipeline", code, body.get("status"), scrub(str(body.get("message") or ""))[:300])
              if code not in {"200", "201"}:
                  raise SystemExit(1)

          execute_body = Path("/tmp/harness-auth-execute.yaml")
          execute_body.write_text(
              "pipeline:\n"
              f"  identifier: {pipeline}\n"
              "  properties:\n"
              "    ci:\n"
              "      codebase:\n"
              "        build:\n"
              "          type: branch\n"
              "          spec:\n"
              "            branch: cursor/harness-images-5527\n"
          )
          code, body = request(
              "POST",
              "https://app.harness.io/pipeline/api/pipeline/execute/"
              f"{pipeline}{query}&moduleType=CI",
              yaml_path=execute_body,
          )
          print("execute", code, body.get("status"), scrub(str(body.get("message") or ""))[:400])
          data = body.get("data") if isinstance(body.get("data"), dict) else {}
          plan = data.get("planExecution") if isinstance(data.get("planExecution"), dict) else {}
          execution = (
              data.get("planExecutionId")
              or data.get("uuid")
              or plan.get("uuid")
              or plan.get("planExecutionId")
              or ""
          )
          print("execution", execution)
          if code not in {"200", "201"} or not execution:
              raise SystemExit(1)

          terminal = {"Success", "Failed", "Errored", "Expired", "Aborted"}
          status = "Unknown"
          summary_url = (
              "https://app.harness.io/pipeline/api/pipelines/execution/summary"
              f"?accountIdentifier={account}&orgIdentifier=default&projectIdentifier=dyad"
              f"&pipelineIdentifier={pipeline}&page=0&size=5"
          )
          for _ in range(36):
              summary_code, summary_body = request(
                  "POST", summary_url, payload={"filterType": "PipelineExecution"}
              )
              rows = ((summary_body.get("data") or {}).get("content") or []) if isinstance(summary_body.get("data"), dict) else []
              status = "Missing"
              for row in rows:
                  if row.get("planExecutionId") == execution:
                      status = row.get("status") or "Unknown"
                      break
              print("poll", summary_code, status)
              if status in terminal:
                  break
              time.sleep(20)
          detail_code, detail = request(
              "GET",
              "https://app.harness.io/pipeline/api/pipelines/execution/v2/"
              f"{execution}?accountIdentifier={account}&orgIdentifier=default"
              "&projectIdentifier=dyad&renderFullBottomGraph=true",
          )
          print("detail_http", detail_code)

          graph = (((detail.get("data") or {}).get("executionGraph") or {}).get("nodeMap") or {})
          if not isinstance(graph, dict):
              graph = {}
          log_keys = []
          for node in graph.values():
              if not isinstance(node, dict):
                  continue
              ident = node.get("identifier")
              if ident not in {"ghcr_auth", "ghcr_auth_probe"}:
                  continue
              print("step", ident, node.get("status"))
              key = node.get("logBaseKey")
              if isinstance(key, str):
                  log_keys.append((ident, key))
          shown = 0
          for ident, key in log_keys:
              link = ""
              for _ in range(12):
                  log_code, log_body = request(
                      "POST",
                      "https://app.harness.io/gateway/log-service/blob/download"
                      f"?accountID={account}&prefix={quote(key, safe='')}",
                      payload={},
                  )
                  log_status = log_body.get("status") if isinstance(log_body, dict) else ""
                  print("log_http", ident, log_code, log_status)
                  if log_status == "success" and isinstance(log_body.get("link"), str):
                      link = log_body["link"]
                      break
                  time.sleep(3)
              if not link:
                  continue
              log_file = Path("/tmp/harness-auth-step.log")
              subprocess.run(
                  ["curl", "-sS", "--max-time", "60", "-o", str(log_file), link],
                  check=False,
                  capture_output=True,
              )
              chunks = []
              if log_file.exists() and zipfile.is_zipfile(log_file):
                  with zipfile.ZipFile(log_file) as archive:
                      print("log_entries", ident, len(archive.namelist()))
                      for name in archive.namelist():
                          chunks.append(archive.read(name).decode("utf-8", "replace"))
              elif log_file.exists():
                  print("log_entries", ident, "plain", log_file.stat().st_size)
                  chunks.append(log_file.read_text("utf-8", "replace"))
              else:
                  print("log_entries", ident, "missing")
              collected = []
              for raw_log in chunks:
                  for line in raw_log.splitlines():
                      if "PRIVATE KEY" in line or "BEGIN " in line:
                          continue
                      text = ""
                      try:
                          parsed = json.loads(line)
                      except json.JSONDecodeError:
                          text = line
                      else:
                          if isinstance(parsed, dict):
                              for key in ("out", "message", "log", "text"):
                                  value = parsed.get(key)
                                  if isinstance(value, str) and value:
                                      text = value
                                      break
                              if not text:
                                  text = "keys=" + ",".join(sorted(parsed)[:12])
                      if not text:
                          continue
                      collected.append(scrub(text)[:300])
              for text in collected[-25:]:
                  print("log", ident, text)
                  shown += 1
          print("probe_lines", shown, "final", status)
          PY
