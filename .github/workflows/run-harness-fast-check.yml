name: Run Harness fast-check with change check

on:
  push:
    branches:
      - cursor/harness-equivalence-5527
    paths:
      - .github/workflows/run-harness-fast-check.yml

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Update the pipeline and run it once
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          HARNESS_ACCOUNT: WKxXBnSFTRaOF64-h90PyQ
        run: |
          python3 << 'PY'
          import json, os, re, subprocess, time, zipfile
          from pathlib import Path

          api_key = os.environ["HARNESS_API_KEY"]
          account = os.environ["HARNESS_ACCOUNT"]
          org = "default"
          project = "dyad"
          pipeline = "dyad_fast_check"
          previous = {"nI911DyPQC2Gd1sIV6yQOw", "AZ8LJ5CLQSGY0QCbWG69_g"}
          running = {
              "Running", "AsyncWaiting", "Queued", "NotStarted", "Paused",
              "ResourceWaiting", "WaitStepRunning", "TimedWaiting",
              "InterventionWaiting", "ApprovalWaiting", "Discontinuing",
              "Starting", "Waiting", "InputWaiting",
          }
          long_token = re.compile(r"[A-Za-z0-9+/=]{40,}")
          signed_url = re.compile(r"https?://\S*(?:signature|token|X-Goog|X-Amz|Expires)\S*", re.I)

          def scrub(text):
              return long_token.sub("[redacted]", signed_url.sub("[redacted-url]", text or ""))

          def request(method, url, payload=None, yaml_path=None):
              out = Path("/tmp/harness-run.bin")
              out.unlink(missing_ok=True)
              cmd = [
                  "curl", "-sS", "--max-time", "60", "-o", str(out), "-w", "%{http_code}",
                  "-X", method, url, "-H", f"x-api-key: {api_key}",
              ]
              if payload is not None:
                  body = Path("/tmp/harness-run.json")
                  body.write_text(json.dumps(payload))
                  cmd += ["-H", "Content-Type: application/json", "--data-binary", f"@{body}"]
              if yaml_path is not None:
                  cmd += ["-H", "Content-Type: application/yaml", "--data-binary", f"@{yaml_path}"]
              result = subprocess.run(cmd, text=True, capture_output=True)
              if result.returncode != 0:
                  print("CURL_FAILED", scrub(result.stderr)[:200])
                  raise SystemExit(1)
              raw = out.read_bytes() if out.exists() else b""
              try:
                  parsed = json.loads(raw.decode("utf-8", "replace")) if raw else {}
              except json.JSONDecodeError:
                  parsed = {}
              return result.stdout.strip(), parsed, raw

          yaml_path = Path("/tmp/fast-check.yaml")
          yaml_path.write_text(Path("deploy/harness/fast-check.yaml").read_text())
          update_url = (
              "https://app.harness.io/pipeline/api/pipelines/v2/"
              f"{pipeline}?accountIdentifier={account}&orgIdentifier={org}&projectIdentifier={project}"
          )
          code, updated, _raw = request("PUT", update_url, yaml_path=yaml_path)
          print("update_http", code, "status", updated.get("status"), "message", scrub(str(updated.get("message") or ""))[:200])
          if code not in {"200", "201"}:
              raise SystemExit(1)
          execute_url = (
              "https://app.harness.io/pipeline/api/pipeline/execute/"
              f"{pipeline}?accountIdentifier={account}&orgIdentifier={org}"
              f"&projectIdentifier={project}&moduleType=CI"
          )
          code, started, _raw = request("POST", execute_url, {})
          data = started.get("data") if isinstance(started.get("data"), dict) else {}
          plan = ((data.get("planExecution") or {}).get("uuid") if isinstance(data.get("planExecution"), dict) else None)
          print("execute_http", code, "execution", plan)
          if code not in {"200", "201"} or not plan:
              raise SystemExit(1)
          summary_url = (
              "https://app.harness.io/pipeline/api/pipelines/execution/summary"
              f"?accountIdentifier={account}&orgIdentifier={org}"
              f"&projectIdentifier={project}&pipelineIdentifier={pipeline}&page=0&size=5"
          )
          status = None
          row = None
          deadline = time.time() + 12 * 60
          while time.time() < deadline:
              code, body, _raw = request("POST", summary_url, {"filterType": "PipelineExecution"})
              rows = ((body.get("data") or {}).get("content") or []) if isinstance(body.get("data"), dict) else []
              row = next((item for item in rows if item.get("planExecutionId") == plan), None)
              status = (row or {}).get("status")
              print("execution", plan, "status=" + str(status))
              if status and status not in running:
                  break
              time.sleep(20)
          start_ts = (row or {}).get("startTs")
          end_ts = (row or {}).get("endTs")
          if start_ts and end_ts:
              print("wall_seconds", round((end_ts - start_ts) / 1000, 1))
          print("HARNESS_RESULT", status)
          print(
              "EXECUTION_URL",
              f"https://app.harness.io/ng/account/{account}/ci/orgs/{org}/projects/{project}/pipelines/{pipeline}/executions/{plan}/pipeline",
          )
          if status in running or not status:
              raise SystemExit(0)
          sequence = (row or {}).get("runSequence")
          prefix = f"{account}/pipeline/{pipeline}/{sequence}/-{plan}/fast_check/check_changes"
          download = f"https://app.harness.io/gateway/log-service/blob/download?accountID={account}&prefix={prefix}"
          for attempt in range(6):
              code, parsed, _raw = request("POST", download, {})
              print("log_poll", attempt, parsed.get("status") if isinstance(parsed, dict) else "")
              if isinstance(parsed, dict) and parsed.get("status") == "success" and parsed.get("link"):
                  fetched = Path("/tmp/check-log.bin")
                  result = subprocess.run(
                      ["curl", "-sS", "--max-time", "60", "-L", "-o", str(fetched), "-w", "%{http_code}", parsed["link"]],
                      text=True, capture_output=True,
                  )
                  print("log_link_http", result.stdout.strip())
                  if fetched.exists() and fetched.read_bytes()[:2] == b"PK":
                      with zipfile.ZipFile(fetched) as archive:
                          for name in archive.namelist()[:2]:
                              for line in archive.read(name).decode("utf-8", "replace").splitlines():
                                  try:
                                      item = json.loads(line)
                                  except json.JSONDecodeError:
                                      item = None
                                  if isinstance(item, dict):
                                      piece = item.get("out") or item.get("message") or ""
                                  else:
                                      piece = line
                                  if re.search(r"decision|could not|changed_count|error|fatal", str(piece), re.I):
                                      print("log", scrub(str(piece))[:240])
                  break
              time.sleep(5)
          detail_url = (
              "https://app.harness.io/pipeline/api/pipelines/execution/v2/"
              f"{plan}?accountIdentifier={account}&orgIdentifier={org}"
              f"&projectIdentifier={project}&renderFullBottomGraph=true"
          )
          code, detail, _raw = request("GET", detail_url)
          data = detail.get("data") if isinstance(detail.get("data"), dict) else {}
          nodes = ((data.get("executionGraph") or {}).get("nodeMap") or {})
          for node in nodes.values():
              if isinstance(node, dict) and node.get("identifier") == "check_changes":
                  print("check_status", node.get("status"))
                  outcomes = node.get("outcomes") or node.get("stepDetails") or {}
                  print("check_outcomes", scrub(json.dumps(outcomes))[:500])
          if plan in previous:
              print("UNEXPECTED_PREVIOUS_EXECUTION")
          PY
