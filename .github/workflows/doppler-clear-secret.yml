# Blank one Doppler secret through the OIDC service identity. Used once to
# clear ai-pilot/dev GOOGLE_OAUTH_TOKEN after its value leaked into a public
# Actions log. The value is never read into the log; only its length is shown
# before and after.
name: Doppler clear secret

on:
  push:
    branches: [cursor/doppler-google-check-be23]
    paths:
      - .github/workflows/doppler-clear-secret.yml

permissions:
  contents: read
  id-token: write

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOPPLER_IDENTITY_ID: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID_THEHUT }}
      DOPPLER_PROJECT: ai-pilot
      DOPPLER_CONFIG: dev
      SECRET_NAME: GOOGLE_OAUTH_TOKEN
    steps:
      - name: Exchange the GitHub OIDC token for a Doppler token
        id: auth
        run: |
          set -euo pipefail
          oidc=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$oidc"
          resp=$(curl -sS -X POST https://api.doppler.com/v3/auth/oidc \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg i "$DOPPLER_IDENTITY_ID" --arg t "$oidc" '{identity:$i, token:$t}')")
          token=$(jq -r '.token // empty' <<<"$resp")
          if [ -z "$token" ]; then
            echo "Doppler OIDC exchange failed: $(jq -c 'del(.token)' <<<"$resp")"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Show the current length of the secret
        env:
          DOPPLER_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          resp=$(curl -sS -w '\n%{http_code}' -u "$DOPPLER_TOKEN:" \
            "https://api.doppler.com/v3/configs/config/secret?project=$DOPPLER_PROJECT&config=$DOPPLER_CONFIG&name=$SECRET_NAME")
          code=$(tail -n1 <<<"$resp")
          body=$(sed '$d' <<<"$resp")
          echo "read status: $code"
          echo "before: raw length $(jq -r '.value.raw // "" | length' <<<"$body")"

      - name: Set the secret to an empty string
        env:
          DOPPLER_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          resp=$(curl -sS -w '\n%{http_code}' -u "$DOPPLER_TOKEN:" -X POST \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg p "$DOPPLER_PROJECT" --arg c "$DOPPLER_CONFIG" --arg n "$SECRET_NAME" '{project:$p, config:$c, secrets:{($n):""}}')" \
            https://api.doppler.com/v3/configs/config/secrets)
          code=$(tail -n1 <<<"$resp")
          body=$(sed '$d' <<<"$resp")
          echo "write status: $code"
          if [ "$code" != "200" ]; then
            echo "error: $(jq -c '.messages // .' <<<"$body")"
            exit 1
          fi

      - name: Verify the secret is empty
        env:
          DOPPLER_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          body=$(curl -sS -u "$DOPPLER_TOKEN:" \
            "https://api.doppler.com/v3/configs/config/secret?project=$DOPPLER_PROJECT&config=$DOPPLER_CONFIG&name=$SECRET_NAME")
          len=$(jq -r '.value.raw // "" | length' <<<"$body")
          echo "after: raw length $len"
          [ "$len" = "0" ]

      - name: Revoke the Doppler token
        if: always() && steps.auth.outputs.token != ''
        env:
          DOPPLER_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          curl -sS -o /dev/null -w 'revoke status: %{http_code}\n' -X POST https://api.doppler.com/v3/auth/revoke \
            -H 'Content-Type: application/json' -d "$(jq -n --arg t "$DOPPLER_TOKEN" '{token:$t}')"
