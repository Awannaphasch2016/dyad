# Print the formula preview service. Changes nothing.
name: Formula status

on:
  workflow_dispatch:
    inputs:
      doppler-project:
        description: Doppler project
        required: false
        type: string
      doppler-config:
        description: Doppler config
        required: false
        type: string
      aws-project:
        description: Second Doppler project
        required: false
        type: string
      aws-config:
        description: Second Doppler config
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Name the Doppler pair
        env:
          PROJECT: ${{ inputs.doppler-project }}
          CONFIG: ${{ inputs.doppler-config }}
        run: |
          set -euo pipefail
          project="${PROJECT:-dyad}"
          config="${CONFIG:-preview}"
          [[ "$project" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$config" =~ ^[A-Za-z0-9_-]+$ ]]
          echo "project=${project}"
          echo "config=${config}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PREVIEW_FORMULA_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Read the service
        run: |
          set -euo pipefail
          aws ecs describe-services \
            --cluster wewebplus-formula-preview \
            --services formula-preview \
            --region ap-southeast-1 \
            --output json > "$RUNNER_TEMP/svc.json"
          service="$(jq -r '.services[0].status // "absent"' "$RUNNER_TEMP/svc.json")"
          desired="$(jq -r '.services[0].desiredCount // "absent"' "$RUNNER_TEMP/svc.json")"
          running="$(jq -r '.services[0].runningCount // "absent"' "$RUNNER_TEMP/svc.json")"
          health="$(jq -r '.services[0].deployments[0].rolloutState // "absent"' "$RUNNER_TEMP/svc.json")"
          echo "service=${service}"
          echo "desired=${desired}"
          echo "running=${running}"
          echo "health=${health}"
          dns="$(aws elbv2 describe-load-balancers \
            --names formula-preview \
            --region ap-southeast-1 \
            --query 'LoadBalancers[0].DNSName' \
            --output text)"
          if [[ "$dns" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "url=http://${dns}"
          else
            echo "url=absent"
          fi
