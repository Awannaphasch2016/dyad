name: Read forma container

# Prints the container files on forma main. It does not deploy or merge.

on:
  push:
    branches:
      - cursor/forma-container-pr-5014
    paths:
      - .github/workflows/read-forma-container.yml

permissions:
  contents: read

jobs:
  read:
    if: github.ref == 'refs/heads/cursor/forma-container-pr-5014'
    runs-on: ubuntu-latest
    environment: ai-bots
    timeout-minutes: 10
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DYAD_GITHUB_APP_ID || '5221649' }}
          private-key: ${{ secrets.DYAD_GITHUB_APP_PEM_KEY }}
          owner: Awannaphasch2016
          repositories: forma
          permission-contents: read

      - name: Print the container definition
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          set +x
          print_file() {
            echo "===== $1 ====="
            gh api "repos/Awannaphasch2016/forma/contents/$1?ref=main" --jq .content | base64 -d
            echo
          }
          print_file Dockerfile
          print_file compose.dev.yml
          echo "===== package.json scripts ====="
          gh api "repos/Awannaphasch2016/forma/contents/package.json?ref=main" --jq .content \
            | base64 -d \
            | jq '{name,packageManager,scripts}'
          echo "===== db ====="
          gh api "repos/Awannaphasch2016/forma/git/trees/main?recursive=1" \
            --jq '.tree[].path | select(test("^(db|prisma|drizzle|scripts)/"))'
          echo "===== migrate.ts ====="
          gh api "repos/Awannaphasch2016/forma/contents/scripts/migrate.ts?ref=main" --jq .content | base64 -d
          echo
          echo "===== env example keys ====="
          gh api "repos/Awannaphasch2016/forma/contents/.env.example?ref=main" --jq .content \
            | base64 -d \
            | awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/{print $1}'
