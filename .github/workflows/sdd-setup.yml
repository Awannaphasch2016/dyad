# Uses the existing classic PAT stored as blog/dev GITHUB_TOKEN in Doppler
# (read through the theHut OIDC identity) to do the two GitHub steps this
# agent's own token cannot: create the public implementation repository, and
# read the private GIT Conference fork. The token is masked before use and
# never printed. The fork inspection report is sealed before upload.
name: SDD setup

on:
  push:
    branches: [cursor/doppler-google-check-be23]
    paths:
      - .github/workflows/sdd-setup.yml
      - scripts/gitcon/**

permissions:
  contents: read
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOPPLER_IDENTITY_ID: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID_THEHUT }}
      IMPL_REPO: Awannaphasch2016/sdd-gitcon-impl
    steps:
      - name: Checkout dyad
        uses: actions/checkout@v5

      - name: Exchange the GitHub OIDC token for a Doppler token
        id: auth
        run: |
          set -euo pipefail
          oidc=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$oidc"
          resp=$(curl -sS -X POST https://api.doppler.com/v3/auth/oidc -H 'Content-Type: application/json' \
            -d "$(jq -n --arg i "$DOPPLER_IDENTITY_ID" --arg t "$oidc" '{identity:$i, token:$t}')")
          token=$(jq -r '.token // empty' <<<"$resp")
          if [ -z "$token" ]; then
            echo "OIDC exchange failed: $(jq -c 'del(.token)' <<<"$resp")"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Read the stored GitHub token
        id: gh
        env:
          DOPPLER_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          raw=$(curl -sS -u "$DOPPLER_TOKEN:" \
            "https://api.doppler.com/v3/configs/config/secret?project=blog&config=dev&name=GITHUB_TOKEN" \
            | jq -r '.value.raw // empty')
          if [ -z "$raw" ]; then
            echo "blog/dev GITHUB_TOKEN is empty"
            exit 1
          fi
          echo "::add-mask::$raw"
          echo "token=$raw" >> "$GITHUB_OUTPUT"

      - name: Create the implementation repository if it does not exist
        env:
          GH_TOKEN: ${{ steps.gh.outputs.token }}
        run: |
          set -euo pipefail
          if gh repo view "$IMPL_REPO" >/dev/null 2>&1; then
            echo "already exists: $IMPL_REPO ($(gh repo view "$IMPL_REPO" --json visibility,isEmpty --jq '.visibility + " empty=" + (.isEmpty|tostring)'))"
          else
            gh repo create "$IMPL_REPO" --public \
              --description "Implementation workspace for SDD experiments. main is the baseline; every experiment is a pull request from a branch named exp/<run-id>."
            echo "created: $IMPL_REPO"
          fi

      - name: Find the GIT Conference fork
        id: fork
        env:
          GH_TOKEN: ${{ steps.gh.outputs.token }}
        run: |
          set -euo pipefail
          names=$(gh api --paginate 'user/repos?per_page=100&affiliation=owner' --jq '.[].full_name')
          echo "repositories owned by the token's user: $(wc -l <<<"$names")"
          match=$(grep -iE '(^|/)[^/]*(git[-_]?con|dec25|dev25)[^/]*$' <<<"$names" | head -n1 || true)
          if [ -z "$match" ]; then
            echo "no owned repository matches git-con/dev25/dec25"
            echo "repo=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found: $match"
          echo "repo=$match" >> "$GITHUB_OUTPUT"

      - name: Inspect the fork
        if: steps.fork.outputs.repo != ''
        env:
          GH_TOKEN: ${{ steps.gh.outputs.token }}
          GITCON_REPO: ${{ steps.fork.outputs.repo }}
          GITCON_REF: main
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq cloc >/dev/null
          gh repo clone "$GITCON_REPO" gitcon -- --quiet
          python3 scripts/gitcon/inspect.py gitcon report.json
          rm -rf gitcon

      - name: Seal the report
        if: steps.fork.outputs.repo != ''
        run: |
          set -euo pipefail
          mkdir -p sealed
          openssl rand -hex 32 > sealed/aes.key
          openssl enc -aes-256-cbc -pbkdf2 -pass file:sealed/aes.key -in report.json -out sealed/report.enc
          openssl pkeyutl -encrypt -pubin -inkey scripts/doppler/google-check-public.pem -in sealed/aes.key -out sealed/aes.key.enc
          rm -f sealed/aes.key report.json

      - name: Upload the sealed report
        if: steps.fork.outputs.repo != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitcon-inspect
          path: sealed
          retention-days: 3

      - name: Revoke the Doppler token
        if: always() && steps.auth.outputs.token != ''
        env:
          DOPPLER_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          curl -sS -o /dev/null -w 'revoke status %{http_code}\n' -X POST https://api.doppler.com/v3/auth/revoke \
            -H 'Content-Type: application/json' -d "$(jq -n --arg t "$DOPPLER_TOKEN" '{token:$t}')"
