# Named privileged operations. The agent dispatches an operation name.
# GitHub Actions exchanges its OIDC token with Doppler. The agent does not
# receive the token, and the operation is not a shell command.
name: Privileged exec

on:
  workflow_dispatch:
    inputs:
      operation:
        description: doppler-status or host-status. Not a shell command.
        required: true
        type: choice
        options:
          - doppler-status
          - host-status
        default: doppler-status
  push:
    branches:
      - cursor/privileged-exec-harness-d072
    paths:
      - .github/workflows/privileged-exec.yml
      - .github/actions/doppler-oidc/action.yml
      - scripts/privileged-exec/**

permissions:
  contents: read
  id-token: write

concurrency:
  group: privileged-exec-${{ github.event.inputs.operation || 'doppler-status' }}
  cancel-in-progress: false

jobs:
  exec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve operation
        id: op
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            operation="$INPUT_OPERATION"
          else
            operation="doppler-status"
          fi
          case "$operation" in
            doppler-status | host-status) ;;
            *)
              echo "operation=refused"
              exit 2
              ;;
          esac
          echo "operation=${operation}"
          echo "operation=${operation}" >> "$GITHUB_OUTPUT"

      - name: Log in to Doppler by OIDC
        id: doppler
        uses: ./.github/actions/doppler-oidc
        with:
          identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}

      - name: Stop when Doppler did not issue a token
        if: steps.doppler.outputs.ok != 'true'
        run: |
          echo "doppler_token=absent"
          exit 1

      - name: Report Doppler status
        run: python3 scripts/privileged-exec/doppler_status.py

      - name: Fetch the SSH key from Doppler when GitHub has none
        if: steps.op.outputs.operation == 'host-status'
        env:
          SYNCED_EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${SYNCED_EC2_SSH_KEY//[[:space:]]/}" ]]; then
            echo "ec2_ssh_key_fetch=skipped reason=github-secret-present"
            exit 0
          fi
          status="$(curl -sS -o "$RUNNER_TEMP/key.json" -w '%{http_code}' \
            -H "Authorization: Bearer ${DOPPLER_TOKEN}" \
            "https://api.doppler.com/v3/configs/config/secret?project=dyad&config=preview&name=EC2_SSH_KEY" || echo 000)"
          echo "ec2_ssh_key_fetch=http-${status} project=dyad config=preview"
          if [[ "$status" == "200" ]]; then
            umask 077
            jq -r '.value.computed // empty' "$RUNNER_TEMP/key.json" > "$RUNNER_TEMP/gascity-ec2"
            if [[ ! -s "$RUNNER_TEMP/gascity-ec2" ]]; then
              rm -f "$RUNNER_TEMP/gascity-ec2"
            fi
          fi
          rm -f "$RUNNER_TEMP/key.json"

      - name: Prepare the SSH key
        id: ssh
        if: steps.op.outputs.operation == 'host-status'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/gascity-ec2"
          if [[ -n "${EC2_SSH_KEY//[[:space:]]/}" ]]; then
            echo "github_ec2_ssh_key=present"
            if [[ ! -f "$key" ]]; then
              python3 scripts/gascity/write_ssh_key.py "$key"
            fi
            echo "ec2_ssh_key_source=github-secret"
          elif [[ -f "$key" ]]; then
            echo "github_ec2_ssh_key=absent"
            echo "ec2_ssh_key_source=doppler-oidc"
          else
            echo "github_ec2_ssh_key=absent"
            echo "ec2_ssh_key_source=none"
            echo "ssh_key_ok=0" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ssh_key_ok=1" >> "$GITHUB_OUTPUT"

      - name: Check Doppler from the production host
        if: steps.op.outputs.operation == 'host-status' && steps.ssh.outputs.ssh_key_ok == '1'
        run: |
          set -euo pipefail
          prefix="DOPPLER_TOKEN=$(printf '%q' "$DOPPLER_TOKEN") "
          ssh -i "$RUNNER_TEMP/gascity-ec2" \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/.github/gascity_known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=20 \
            -o BatchMode=yes \
            ubuntu@13.251.216.187 \
            "${prefix}python3 -" < scripts/privileged-exec/host_status.py
          echo "ec2_ssh=ok"
