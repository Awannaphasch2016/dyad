# One-shot cleanup: delete the workflow run whose log leaked a Google
# credential before the masking fix. The job token carries actions:write,
# which this repository grants to workflows, so it can delete a run that the
# background agent's installation token cannot. Remove this file afterward.
name: Delete leaked run

on:
  push:
    branches: [cursor/doppler-google-check-be23]
    paths:
      - .github/workflows/delete-leaked-run.yml

permissions:
  actions: write
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the leaked run
        env:
          GH_TOKEN: ${{ github.token }}
          LEAKED_RUN_IDS: "37968866053"
        run: |
          set -euo pipefail
          for id in $LEAKED_RUN_IDS; do
            echo "Deleting run $id"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" && echo "deleted $id" || echo "could not delete $id"
          done
