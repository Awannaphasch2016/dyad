# Prove each link from GitHub Actions to the production host and on to
# Doppler. Prints names, statuses, and fingerprints. Never prints a key,
# a token, a secret value, or a role ARN. Changes nothing on the host.
name: EC2 access check

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/axi-toolbox-image-plan-531e
    paths:
      - .github/workflows/ec2-access-check.yml
      - .github/actions/doppler-oidc/action.yml
      - scripts/gascity/check_host_access.py
      - deploy/doppler/identity

permissions:
  contents: read
  id-token: write

concurrency:
  group: ec2-access-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The Doppler sync writes DOPPLER_PROJECT and DOPPLER_CONFIG beside the
      # secrets it delivers, as secrets or as variables. Matching them against
      # known names says which config feeds this repository without printing
      # a secret value.
      - name: Say which Doppler config feeds this repository
        env:
          SECRET_PROJECT: ${{ secrets.DOPPLER_PROJECT }}
          SECRET_CONFIG: ${{ secrets.DOPPLER_CONFIG }}
          VAR_PROJECT: ${{ vars.DOPPLER_PROJECT }}
          VAR_CONFIG: ${{ vars.DOPPLER_CONFIG }}
        run: |
          set -euo pipefail
          classify() {
            local value="$1"; shift
            if [[ -z "$value" ]]; then echo absent; return; fi
            local known
            for known in "$@"; do
              if [[ "$value" == "$known" ]]; then echo "$known"; return; fi
            done
            echo other
          }
          project="$(classify "${SECRET_PROJECT:-$VAR_PROJECT}" dyad aws ai-pilot)"
          config="$(classify "${SECRET_CONFIG:-$VAR_CONFIG}" dev ci preview prd)"
          echo "github_sync_project=${project}"
          echo "github_sync_config=${config}"

      # When no sync delivers the key, fetch it from Doppler itself with a
      # short-lived token obtained by OIDC. The key goes straight from the
      # API response into the mode-600 file; it is never an env var or output.
      - name: Log in to Doppler by OIDC
        id: doppler
        uses: ./.github/actions/doppler-oidc
        with:
          identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}

      - name: Fetch the SSH key from Doppler when GitHub has none
        if: steps.doppler.outputs.ok == 'true'
        env:
          SYNCED_EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${SYNCED_EC2_SSH_KEY//[[:space:]]/}" ]]; then
            echo "ec2_ssh_key_fetch=skipped reason=github-secret-present"
            exit 0
          fi
          status="$(curl -sS -o "$RUNNER_TEMP/key.json" -w '%{http_code}' \
            -H "Authorization: Bearer ${DOPPLER_TOKEN}" \
            "https://api.doppler.com/v3/configs/config/secret?project=dyad&config=preview&name=EC2_SSH_KEY" || echo 000)"
          echo "ec2_ssh_key_fetch=http-${status} project=dyad config=preview"
          if [[ "$status" == "200" ]]; then
            umask 077
            jq -r '.value.computed // empty' "$RUNNER_TEMP/key.json" > "$RUNNER_TEMP/gascity-ec2"
            [[ -s "$RUNNER_TEMP/gascity-ec2" ]] || rm -f "$RUNNER_TEMP/gascity-ec2"
          fi
          rm -f "$RUNNER_TEMP/key.json"

      - name: Check the SSH key and the synced Doppler token
        id: secrets
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SYNCED_DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          ok=1
          key="$RUNNER_TEMP/gascity-ec2"
          if [[ -n "${EC2_SSH_KEY//[[:space:]]/}" ]]; then
            echo "github_ec2_ssh_key=present"
            if [[ ! -f "$key" ]]; then
              python3 scripts/gascity/write_ssh_key.py "$key"
            fi
            echo "ec2_ssh_key_source=github-secret"
          elif [[ -f "$key" ]]; then
            echo "github_ec2_ssh_key=absent"
            echo "ec2_ssh_key_source=doppler-oidc"
          else
            echo "github_ec2_ssh_key=absent"
            echo "ec2_ssh_key_source=none"
            ok=0
          fi
          if [[ -f "$key" ]]; then
            if fp="$(ssh-keygen -l -f "$key" 2>/dev/null)"; then
              echo "ec2_ssh_key=private-key fingerprint=$(printf '%s' "$fp" | awk '{print $2}')"
            else
              echo "ec2_ssh_key=present-but-not-a-private-key"
              ok=0
            fi
          fi
          if [[ -z "${SYNCED_DOPPLER_TOKEN//[[:space:]]/}" ]]; then
            echo "github_doppler_token=absent"
          else
            status="$(curl -sS -o "$RUNNER_TEMP/doppler.json" -w '%{http_code}' \
              -H "Authorization: Bearer ${SYNCED_DOPPLER_TOKEN}" \
              https://api.doppler.com/v3/configs/config || echo 000)"
            project="$(jq -r '.config.project // "unknown"' "$RUNNER_TEMP/doppler.json" 2>/dev/null || echo unknown)"
            config="$(jq -r '.config.name // "unknown"' "$RUNNER_TEMP/doppler.json" 2>/dev/null || echo unknown)"
            echo "github_doppler_token=http-${status} project=${project} config=${config}"
            rm -f "$RUNNER_TEMP/doppler.json"
          fi
          echo "ssh_key_ok=${ok}" >> "$GITHUB_OUTPUT"
          if [[ "$ok" != "1" ]]; then
            echo "No SSH key reached this run: no Doppler sync delivers EC2_SSH_KEY and no OIDC identity is configured (see doppler_identity / doppler_oidc above)." >&2
            exit 1
          fi

      - name: SSH to the host and check its Doppler tokens
        if: steps.secrets.outputs.ssh_key_ok == '1'
        run: |
          set -euo pipefail
          prefix=""
          if [[ -n "${DOPPLER_TOKEN:-}" ]]; then
            prefix="DOPPLER_TOKEN=$(printf '%q' "$DOPPLER_TOKEN") "
          fi
          ssh -i "$RUNNER_TEMP/gascity-ec2" \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/.github/gascity_known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=20 \
            -o BatchMode=yes \
            ubuntu@13.251.216.187 \
            "${prefix}python3 -" < scripts/gascity/check_host_access.py
          echo "ec2_ssh=ok"
