# Experiment 1 and 4 comparison. Tags start with harness-gha- or harness-.
# This workflow does not push the live preview tag, the commit tag, or the live context tag.
name: Harness image comparison

concurrency:
  group: harness-image-compare-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - cursor/harness-images-5527
    paths:
      - .github/workflows/harness-image-compare.yml
      - Dockerfile.gascity
      - scripts/gascity/harness-image.sh

jobs:
  gascity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Free runner disk before the image build
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build or reuse the Gas City image
        env:
          IMAGE_TAG_PREFIX: harness-gha
        run: bash scripts/gascity/harness-image.sh gascity

  dyad:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Free runner disk before the image build
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build or reuse the Dyad image
        env:
          IMAGE_TAG_PREFIX: harness-gha
        run: bash scripts/gascity/harness-image.sh dyad
