# Experiment 1 and 4 comparison. Tags start with harness-gha- or harness-.
# This workflow does not push the live preview tag, the commit tag, or the live context tag.
name: Harness image comparison

on:
  push:
    branches:
      - cursor/harness-images-5527
    paths:
      - .github/workflows/harness-image-compare.yml
      - Dockerfile.gascity
      - scripts/gascity/harness-image.sh
      - scripts/harness/ghcr_app_login.py
      - deploy/harness/images.yaml

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Register and start the Harness image pipeline
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          HARNESS_ACCOUNT: WKxXBnSFTRaOF64-h90PyQ
        run: |
          python3 << 'PY'
          import json, os, re, subprocess
          from pathlib import Path

          api_key = os.environ["HARNESS_API_KEY"]
          account = os.environ["HARNESS_ACCOUNT"]
          long_token = re.compile(r"[A-Za-z0-9+/=]{40,}")

          def scrub(text):
              return long_token.sub("[redacted]", text or "")

          def request(method, url, yaml_path=None, payload=None):
              out = Path("/tmp/harness-image.bin")
              out.unlink(missing_ok=True)
              cmd = [
                  "curl", "-sS", "--max-time", "60", "-o", str(out), "-w", "%{http_code}",
                  "-X", method, url, "-H", f"x-api-key: {api_key}",
              ]
              if yaml_path is not None:
                  cmd += ["-H", "Content-Type: application/yaml", "--data-binary", f"@{yaml_path}"]
              elif payload is not None:
                  body = Path("/tmp/harness-image.json")
                  body.write_text(json.dumps(payload))
                  cmd += ["-H", "Content-Type: application/json", "--data-binary", f"@{body}"]
              result = subprocess.run(cmd, text=True, capture_output=True)
              if result.returncode != 0:
                  print("CURL_FAILED", scrub(result.stderr)[:200])
                  raise SystemExit(1)
              raw = out.read_text("utf-8", "replace") if out.exists() else ""
              try:
                  parsed = json.loads(raw) if raw else {}
              except json.JSONDecodeError:
                  parsed = {"raw": scrub(raw)[:300]}
              return result.stdout.strip(), parsed

          pipeline = "dyad_harness_images"
          code, body = request(
              "PUT",
              "https://app.harness.io/pipeline/api/pipelines/v2/"
              f"{pipeline}?accountIdentifier={account}&orgIdentifier=default&projectIdentifier=dyad",
              yaml_path="deploy/harness/images.yaml",
          )
          print("update_pipeline", code, body.get("status"), scrub(str(body.get("message") or ""))[:300])
          if code not in {"200", "201"}:
              raise SystemExit(1)

          execute_body = Path("/tmp/harness-image-execute.yaml")
          execute_body.write_text(
              "pipeline:\n"
              f"  identifier: {pipeline}\n"
              "  properties:\n"
              "    ci:\n"
              "      codebase:\n"
              "        build:\n"
              "          type: branch\n"
              "          spec:\n"
              "            branch: cursor/harness-images-5527\n"
          )
          code, body = request(
              "POST",
              "https://app.harness.io/pipeline/api/pipeline/execute/"
              f"{pipeline}?accountIdentifier={account}&orgIdentifier=default"
              "&projectIdentifier=dyad&moduleType=CI",
              yaml_path=execute_body,
          )
          print("execute", code, body.get("status"), scrub(str(body.get("message") or ""))[:300])
          data = body.get("data") if isinstance(body.get("data"), dict) else {}
          execution = data.get("planExecutionId") or data.get("uuid") or ""
          plan = data.get("planExecution") if isinstance(data.get("planExecution"), dict) else {}
          execution = execution or plan.get("uuid") or plan.get("planExecutionId") or ""
          print("execution", execution)
          if code not in {"200", "201"}:
              raise SystemExit(1)
          PY

  gascity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Free runner disk before the image build
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build or reuse the Gas City image
        env:
          IMAGE_TAG_PREFIX: harness-gha
        run: bash scripts/gascity/harness-image.sh gascity

  dyad:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Free runner disk before the image build
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build or reuse the Dyad image
        env:
          IMAGE_TAG_PREFIX: harness-gha
        run: bash scripts/gascity/harness-image.sh dyad
