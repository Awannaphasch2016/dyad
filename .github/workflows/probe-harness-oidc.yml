# Mint one Harness custom OIDC token and print allowlisted claims.
# This probe does not create a Doppler identity.
name: Probe Harness OIDC claims

on:
  push:
    branches:
      - cursor/harness-doppler-5527
    paths:
      - .github/workflows/probe-harness-oidc.yml
      - scripts/harness/doppler_oidc.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Print OIDC claims and Doppler names
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          DOPPLER_ADMIN_TOKEN: ${{ secrets.DOPPLER_ADMIN_TOKEN }}
        run: python3 scripts/harness/doppler_oidc.py probe-once
