# Print the HTTP status of the Vibe SDK preview worker. Changes nothing.
name: Vibe status

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      doppler-project:
        description: Doppler project
        required: false
        type: string
      doppler-config:
        description: Doppler config
        required: false
        type: string

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the worker
        env:
          PR: ${{ inputs.pr }}
          PROJECT: ${{ inputs.doppler-project }}
          CONFIG: ${{ inputs.doppler-config }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]]
          project="${PROJECT:-dyad}"
          config="${CONFIG:-preview}"
          echo "project=${project}"
          echo "config=${config}"
          url="https://vibesdk-pr-${PR}.karant-test-egress-canary.workers.dev"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)"
          echo "url=${url}"
          echo "http=${code}"
