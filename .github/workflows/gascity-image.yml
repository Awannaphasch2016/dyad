# Build the Gas City agent image from Awannaphasch2016/gascity and publish it.
# The production host is not a target. The gc binary is compiled from the fork.
name: Publish Gas City image

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/gascity-image-9e7a

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout the Gas City fork
        uses: actions/checkout@v5
        with:
          repository: Awannaphasch2016/gascity
          path: gascity
          fetch-depth: 1

      - name: Free runner disk before the image build
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: gascity/go.mod
          cache-dependency-path: gascity/go.sum

      - name: Build the gc binary from the fork
        working-directory: gascity
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -o gc ./cmd/gc
          ./gc version
          set -a
          # shellcheck disable=SC1091
          source ./deps.env
          set +a
          bash .github/scripts/install-br-archive.sh "$BR_VERSION"
          cp /usr/local/bin/br ./br
          chmod 755 ./br
          echo "GASCITY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the base image
        uses: docker/build-push-action@v6
        with:
          context: gascity
          file: gascity/contrib/k8s/Dockerfile.base
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/awannaphasch2016/gascity-base:sha-${{ env.GASCITY_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/Awannaphasch2016/gascity
            org.opencontainers.image.revision=${{ env.GASCITY_SHA }}

      - name: Build and push the agent image
        uses: docker/build-push-action@v6
        with:
          context: gascity
          file: gascity/contrib/k8s/Dockerfile.agent
          push: true
          provenance: false
          sbom: false
          build-args: |
            BASE_IMAGE=ghcr.io/awannaphasch2016/gascity-base:sha-${{ env.GASCITY_SHA }}
          tags: |
            ghcr.io/awannaphasch2016/gascity:sha-${{ env.GASCITY_SHA }}
            ghcr.io/awannaphasch2016/gascity:preview
          labels: |
            org.opencontainers.image.source=https://github.com/Awannaphasch2016/gascity
            org.opencontainers.image.revision=${{ env.GASCITY_SHA }}

      - name: Pull the published image
        env:
          IMAGE: ghcr.io/awannaphasch2016/gascity:sha-${{ env.GASCITY_SHA }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE"
          docker pull "$IMAGE"
          docker run --rm --entrypoint /usr/local/bin/gc "$IMAGE" version
