# Publish the bare domain onto the canary tunnel.
# A normal canary deploy cannot write this name. This file's push trigger
# runs the writer once. It does not stop gascity-server.
# The canary OIDC identity trusts only canary-verify.yml, so this job reads
# dyad/canary with the admin token and never requests dyad/prd.
# A Vercel token that names a team scope is retried with that team slug.

name: Promote apex

on:
  push:
    branches:
      - cursor/ecs-hitl-cutover-bbea
    paths:
      - .github/workflows/promote-apex.yml

permissions:
  contents: read

jobs:
  promote:
    if: github.ref == 'refs/heads/cursor/ecs-hitl-cutover-bbea'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Load dyad canary secrets
        env:
          DOPPLER_ADMIN_TOKEN: ${{ secrets.DOPPLER_ADMIN_TOKEN }}
        run: node deploy/preview/load-canary-secrets.mjs

      - name: Publish the apex after the running image matches
        run: node deploy/preview/publish-apex.mjs
