name: Create preview-forma host

# One shot. Creates the Fargate cluster, load balancer, and task definition
# in ap-southeast-1. Does not run a task. Do not merge.

on:
  push:
    branches:
      - cursor/preview-forma-fargate-host-5014
    paths:
      - .github/workflows/preview-forma-host.yml
      - scripts/gascity/preview-forma-host.mjs
      - scripts/gascity/preview-forma-host.test.mjs

permissions:
  contents: read

jobs:
  host:
    if: github.ref == 'refs/heads/cursor/preview-forma-fargate-host-5014'
    runs-on: ubuntu-latest
    environment: ai-bots
    timeout-minutes: 15
    steps:
      - name: Check out the host script
        uses: actions/checkout@v5

      - name: Create the host
        env:
          DOPPLER_ADMIN_TOKEN: ${{ secrets.DOPPLER_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          node scripts/gascity/preview-forma-host.mjs
