description = """
Spec Kit command sequence on the Gas City build-base contract.

This formula does not run specify workflow. The workflow engine owns its own
TTY gates, and this graph would fight it for resume.

Commands, in order: specify, clarify, plan, tasks, implement, converge.
clarify sends at most five questions, and only when spec.md still contains
NEEDS CLARIFICATION. Plan and tasks do not stop for a person.
The task drain is the implement command. converge appends missing work to tasks.md.
"""
formula = "speckit-build"
version = 1
contract = "graph.v2"
extends = ["build-base"]
target_required = true

[catalog]
name = "speckit-build"
description = "Run Spec Kit commands as Gas City steps: specify, clarify, plan, tasks, implement, converge. Does not run specify workflow."

[metadata.gc.methodology]
allowed_drain_policies = ["separate", "same-session"]
implementation_strategy = "drain"
interaction_modes = ["interactive", "autonomous", "headless"]
review_modes = ["report", "agent", "interactive"]

[vars]
[vars.implementation_target]
description = "Worker that implements one Spec Kit task."
default = "gc.implementation-worker"

[vars.planning_formula]
description = "Planning formula. The Spec Kit sequence lives on speckit-build."
default = "planning-base"

[vars.decomposition_formula]
description = "Decomposition formula. Tasks are written by the decompose step."
default = "decomposition-base"

[vars.implementation_formula]
description = "Per-task drain formula."
default = "do-work"

[vars.implementation_item_formula]
description = "Shared-session per-task formula."
default = "do-work-item"

[vars.code_review_formula]
description = "Review formula used when a host delegates review."
default = "review"

[vars.review_fix_formula]
description = "Fix loop used after converge finds missing tasks."
default = "fix-loop-base"

[[steps]]
id = "requirements"
title = "Specify"
needs = ["prepare"]
metadata = { "gc.run_target" = "gc.requirements-planner", "gc.build.artifact_schema" = "gc.build.requirements.v1", "gc.build.artifact_path_keys" = "gc.build.requirements_path,gc.var.requirements_path" }
description = """
Write {{artifact_root}}/spec.md for what the change must do.
Mark anything unresolved as NEEDS CLARIFICATION. Do not write the plan or the tasks.
Do not run specify workflow.
"""

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "clarify"
title = "Clarify"
needs = ["requirements"]
metadata = { "gc.run_target" = "gc.run-operator" }
description = """
Read {{artifact_root}}/spec.md.
When it contains no NEEDS CLARIFICATION markers, close this step without sending mail.
When it does, send exactly one gc mail send human for this attempt. Ask at most five questions in that one mail. Include this bead id and the spec path. Do not pass --notify.
Wait for the reply. Write each answer into spec.md and remove the matching marker.
Do not invent an answer. Do not run specify workflow.
If a reply is already on the bead or in the mail thread, apply it instead of sending another mail.
interaction_mode does not skip a real ambiguity.
"""

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/speckit-clarified.sh"
timeout = "10m"

[[steps]]
id = "plan"
title = "Plan"
needs = ["clarify"]
metadata = { "gc.run_target" = "gc.design-author", "gc.build.artifact_schema" = "gc.build.plan.v1", "gc.build.artifact_path_keys" = "gc.build.plan_path,gc.var.plan_path" }
description = """
Write {{artifact_root}}/plan.md for how to implement the spec.
Do not generate tasks in this step. Do not run specify workflow.
"""

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "plan-review"
title = "Record the Spec Kit plan"
needs = ["plan"]
metadata = { "gc.run_target" = "gc.run-operator" }
description = """
Spec Kit does not stop for a person between plan and tasks.
Record the plan path and close this anchor. Do not send mail.
"""

[[steps]]
id = "decompose"
title = "Tasks"
needs = ["plan"]
metadata = { "gc.run_target" = "gc.task-decomposer", "gc.build.artifact_schema" = "gc.build.decomposition.v1", "gc.build.artifact_path_keys" = "gc.build.decomposition_path,gc.var.decomposition_path" }
description = """
Write {{artifact_root}}/tasks.md as checkboxes derived from the plan.
Do not implement them here. Do not run specify workflow.
"""

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "implement"
title = "Implement tasks in separate sessions"
needs = ["decompose"]
condition = "{{drain_policy}} == separate"
metadata = { "gc.run_target" = "{{implementation_target}}" }
description = """
Drain tasks.md in separate sessions. This is the implement command.
Do not run specify workflow. Do not edit source files from this control bead.
"""

[steps.drain]
context = "separate"
formula = "do-work"
member_access = "exclusive"

[[steps]]
id = "implement-same-session"
title = "Implement tasks in one shared session"
needs = ["decompose"]
condition = "{{drain_policy}} == same-session"
metadata = { "gc.run_target" = "{{implementation_target}}" }
description = """
Drain tasks.md in one shared session, one item at a time.
Do not run specify workflow.
"""

[steps.drain]
context = "shared"
formula = "do-work-item"
on_item_failure = "skip_remaining"
member_access = "exclusive"

[steps.drain.item]
single_lane = true

[[steps]]
id = "review"
title = "Converge"
needs = ["summarize-implementation"]
metadata = { "gc.run_target" = "gc.implementation-reviewer", "gc.build.artifact_schema" = "gc.build.review.v1", "gc.build.artifact_path_keys" = "gc.build.review_report_path" }
description = """
Compare the codebase with spec.md, plan.md, and tasks.md.
Append any missing work to tasks.md. This is a completion check.
Do not run specify workflow.
"""

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "finalize"
title = "Finalize the Spec Kit build"
needs = ["review"]
metadata = { "gc.run_target" = "gc.run-operator", "gc.build.artifact_schema" = "gc.build.final-report.v1", "gc.build.artifact_path_keys" = "gc.build.final_report_path" }
description = """
Write the final report: spec, plan, tasks, and the converge report.
Publishing stays on the publish step.
"""

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"
