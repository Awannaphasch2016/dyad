description = """
OpenSpec change on the Gas City build-base contract.

Gas City orders the steps. The OpenSpec CLI validates and archives. This formula
does not ask the CLI to route tasks.

Artifacts under artifact_root:
- proposal.md
- specs/**/spec.md, with a #### Scenario: on every added or modified requirement
- design.md
- tasks.md

specs and design both need only the proposal, so they can run together.
tasks needs both. The native pause before apply is a human gate: one open bead,
one mail to human, and a verdict check. approve starts the task drain.
request-changes runs the revision child, which rewrites the change artifacts.

Archive is its own step after finalize. Publish needs that archive.
"""
formula = "openspec-build"
version = 1
contract = "graph.v2"
extends = ["build-base"]
target_required = true

[catalog]
name = "openspec-build"
description = "Run an OpenSpec change as Gas City steps: proposal, parallel specs and design, tasks, a human pause, then apply and archive."

[metadata.gc.methodology]
allowed_drain_policies = ["separate", "same-session"]
implementation_strategy = "drain"
interaction_modes = ["interactive", "autonomous", "headless"]
review_modes = ["report", "agent", "interactive"]

[vars]
[vars.implementation_target]
description = "Worker that applies one OpenSpec task."
default = "gc.implementation-worker"

[vars.planning_formula]
description = "Planning formula. The OpenSpec sequence lives on openspec-build."
default = "planning-base"

[vars.decomposition_formula]
description = "Decomposition formula. Tasks are written by the decompose step."
default = "decomposition-base"

[vars.implementation_formula]
description = "Per-task drain formula."
default = "do-work"

[vars.implementation_item_formula]
description = "Shared-session per-task formula."
default = "do-work-item"

[vars.code_review_formula]
description = "Review formula used when a host delegates review."
default = "review"

[vars.review_fix_formula]
description = "Fix loop used after a failed review."
default = "fix-loop-base"

[[steps]]
id = "requirements"
title = "Write the OpenSpec proposal"
needs = ["prepare"]
metadata = { "gc.run_target" = "gc.requirements-planner", "gc.build.artifact_schema" = "gc.build.requirements.v1", "gc.build.artifact_path_keys" = "gc.build.requirements_path,gc.var.requirements_path" }
description = """
Write {{artifact_root}}/proposal.md.

Include why the change is needed, what is out of scope, and the capability names.
Leave a question in the proposal when a requirement is ambiguous.
Do not write specs, design, or tasks in this step.
"""

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "specs"
title = "Write OpenSpec delta specs"
needs = ["requirements"]
metadata = { "gc.run_target" = "gc.requirements-planner" }
description = """
Write one specs/<capability>/spec.md per capability named in the proposal.
Under each added or modified requirement, add at least one #### Scenario: with
WHEN and THEN. This step needs only the proposal. It does not wait for design.
"""

[[steps]]
id = "plan"
title = "Write the OpenSpec design"
needs = ["requirements"]
metadata = { "gc.run_target" = "gc.design-author", "gc.build.artifact_schema" = "gc.build.plan.v1", "gc.build.artifact_path_keys" = "gc.build.plan_path,gc.var.plan_path" }
description = """
Write {{artifact_root}}/design.md for how the change is implemented.
This step needs only the proposal. It can run beside specs.
The design does not add requirements.
"""

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "plan-review"
title = "Record the OpenSpec design"
needs = ["plan"]
metadata = { "gc.run_target" = "gc.run-operator" }
description = """
OpenSpec does not stop for a person between design and tasks.
Record the design path and close this anchor. Do not send mail.
"""

[[steps]]
id = "decompose"
title = "Write OpenSpec tasks"
needs = ["specs", "plan"]
metadata = { "gc.run_target" = "gc.task-decomposer", "gc.build.artifact_schema" = "gc.build.decomposition.v1", "gc.build.artifact_path_keys" = "gc.build.decomposition_path,gc.var.decomposition_path" }
description = """
Write {{artifact_root}}/tasks.md as a checkbox list.
Every task names the scenario it satisfies. Do not start implementation.
"""

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "scenario-validate"
title = "Validate OpenSpec scenarios"
needs = ["decompose"]
metadata = { "gc.run_target" = "gc.run-operator" }
description = """
Confirm the change folder has delta specs and tasks.md.
The check script requires a #### Scenario: heading in each spec and, when the
openspec CLI is on PATH, runs openspec validate --strict.
This is a completion check. It does not ask a person.
"""

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/openspec-scenarios.sh"
timeout = "5m"

[[steps]]
id = "accept-apply"
title = "Stop before applying the OpenSpec change"
needs = ["scenario-validate"]
metadata = { "gc.run_target" = "gc.run-operator", "gc.human_gate.phase" = "apply", "gc.human_gate.question" = "Apply this OpenSpec change?" }
description = """
OpenSpec's propose workflow stops after tasks and waits for a later request before apply.
approve opens the task drain. request-changes runs the revision child again.
"""

[steps.check]
max_attempts = 6

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/human-gate-verdict.sh"
timeout = "10m"

[[steps.children]]
id = "revise-apply"
title = "Revise the OpenSpec change"
metadata = { "gc.run_target" = "gc.run-operator", "gc.human_gate.phase" = "apply" }
description_file = "../assets/workflows/revise-phase.md"

[[steps.children]]
id = "confirm-apply"
title = "Ask whether to apply the change"
needs = ["revise-apply"]
metadata = { "gc.run_target" = "gc.run-operator", "gc.human_gate.phase" = "apply", "gc.human_gate.question" = "Apply this OpenSpec change?", "human_gate.loop_step" = "accept-apply" }
description_file = "../assets/workflows/confirm-human-gate.md"

[[steps]]
id = "implement"
title = "Apply OpenSpec tasks in separate sessions"
needs = ["accept-apply"]
condition = "{{drain_policy}} == separate"
metadata = { "gc.run_target" = "{{implementation_target}}" }
description = """
Drain the tasks as separate sessions. Each session checks one task and the
scenario it names. Do not edit source files from this control bead.
"""

[steps.drain]
context = "separate"
formula = "do-work"
member_access = "exclusive"

[[steps]]
id = "implement-same-session"
title = "Apply OpenSpec tasks in one shared session"
needs = ["accept-apply"]
condition = "{{drain_policy}} == same-session"
metadata = { "gc.run_target" = "{{implementation_target}}" }
description = """
Drain the tasks in one shared session, one item at a time.
"""

[steps.drain]
context = "shared"
formula = "do-work-item"
on_item_failure = "skip_remaining"
member_access = "exclusive"

[steps.drain.item]
single_lane = true

[[steps]]
id = "review"
title = "Review the applied change"
needs = ["summarize-implementation"]
metadata = { "gc.run_target" = "gc.implementation-reviewer", "gc.build.artifact_schema" = "gc.build.review.v1", "gc.build.artifact_path_keys" = "gc.build.review_report_path" }
description = """
Write the review report. Compare the diff with the scenarios and the checked tasks.
"""

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "finalize"
title = "Finalize the OpenSpec build"
needs = ["review"]
metadata = { "gc.run_target" = "gc.run-operator", "gc.build.artifact_schema" = "gc.build.final-report.v1", "gc.build.artifact_path_keys" = "gc.build.final_report_path" }
description = """
Write the final report: proposal, scenario counts, review report, and archive readiness.
Do not archive in this step. Archive is the next step.
"""

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "archive"
title = "Archive the OpenSpec change"
needs = ["finalize"]
metadata = { "gc.run_target" = "gc.run-operator" }
description = """
Archive the change at {{artifact_root}}.
When the openspec CLI is on PATH, run openspec archive for this change.
When it is not, move the delta specs into the main spec tree and record the archive path as gc.build.archive_path on the workflow root.
"""

[[steps]]
id = "publish"
title = "Optionally publish the OpenSpec build"
needs = ["archive"]
metadata = { "gc.run_target" = "gc.publisher" }
description = """
Publish only after archive.
If push or open_pr is enabled, publish the archived result.
If publishing is disabled, record gc.build.publish_status=noop and leave the artifacts in place.
Close this step only after the publish action or the explicit no-op is recorded.
"""
